<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Payment cancelled — AhamStree</title>
  <meta http-equiv="refresh" content="0; url=success.html?status=cancelled" />
  <script>
    // Legacy cancel return URL: hand off to the single payment-status page,
    // keeping an order_id if one was supplied.
    (function () {
      var p = new URLSearchParams(location.search);
      var q = new URLSearchParams({ status: "cancelled" });
      var id = p.get("order_id") || p.get("razorpay_payment_link_reference_id");
      if (id) q.set("order_id", id);
      location.replace("success.html?" + q.toString());
    })();
  </script>
</head>
<body>
  <p style="font-family:sans-serif;padding:24px;">Payment cancelled. <a href="success.html?status=cancelled">Continue</a></p>
</body>
</html>
