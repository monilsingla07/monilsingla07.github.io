<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My Wishlist — AhamStree</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="assets/styles.css" />
</head>

<body>
  <div id="header"></div>

  <div class="container" style="padding-top: 40px; padding-bottom: 40px;">
    <h1 style="font-size: 32px; margin-bottom: 8px;">My Wishlist</h1>
    <p style="color: var(--text-light); margin-bottom: 32px;">
      Your saved sarees
    </p>

    <div id="wishlistStatus" style="text-align: center; padding: 20px;"></div>
    <div id="wishlistGrid" class="grid grid-3"></div>
  </div>

  <div id="footer"></div>

  <script type="module">
    import { renderHeader, renderFooter, hydrateHeaderAuth } from "./assets/ui.js";
    import { getWishlist, removeFromWishlist } from "./assets/wishlist.js";
    import { escapeHtml, escapeAttr, safeSrc } from "./assets/safe.js";

    document.getElementById("header").innerHTML = renderHeader("wishlist");
    hydrateHeaderAuth();
    document.getElementById("footer").innerHTML = renderFooter();

    const wishlistGrid = document.getElementById('wishlistGrid');
    const wishlistStatus = document.getElementById('wishlistStatus');

    // Load wishlist
    loadWishlist();

    function moneyINR(v) {
      const n = Number(v);
      if (!Number.isFinite(n)) return "";
      return "₹" + n.toLocaleString("en-IN", { maximumFractionDigits: 0 });
    }

    async function loadWishlist() {
      wishlistStatus.textContent = 'Loading...';

      const { data: products, error } = await getWishlist();

      if (error) {
        wishlistStatus.textContent = 'Error loading wishlist';
        return;
      }

      wishlistStatus.textContent = '';

      if (!products || products.length === 0) {
        wishlistGrid.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; padding: 60px 20px;">
            <p style="font-size: 18px; color: var(--text-light); margin-bottom: 20px;">
              Your wishlist is empty
            </p>
            <a href="products.html" class="btn">Browse Products</a>
          </div>
        `;
        return;
      }

      wishlistGrid.innerHTML = products.map((product, idx) => {
        const price = Number(product.price_inr || 0);
        const sale = product.sale_price_inr === null || product.sale_price_inr === undefined
          ? null
          : Number(product.sale_price_inr || 0);

        const hasSale = Number.isFinite(sale) && sale > 0 && sale < price && Number.isFinite(price);
        const pctOff = hasSale ? Math.round((1 - sale / price) * 100) : 0;
        const priceHtml = hasSale
          ? `<span class="p-card-original">${moneyINR(price)}</span><span class="p-card-sale-price">${moneyINR(sale)}</span>`
          : `<span class="p-card-price">${moneyINR(price)}</span>`;

        const available = Math.max(0, Number(product.inventory_qty || 0) - Number(product.reserved_qty || 0));
        const soldOut = available <= 0;

        const imgHtml = product.image_url
          ? `<img class="${product.image_url_hover ? "p-card-img-primary" : ""}" src="${safeSrc(product.image_url)}" alt="${escapeAttr(product.title || 'Product')}" loading="lazy" decoding="async">${product.image_url_hover ? `<img class="p-card-img-hover" src="${safeSrc(product.image_url_hover)}" alt="" loading="lazy" decoding="async" aria-hidden="true">` : ""}`
          : `<div class="p-card-img-empty"></div>`;

        return `
          <div class="p-card" style="animation-delay:${(idx % 8) * 55}ms">
            <a href="product.html?id=${encodeURIComponent(product.id)}&from=wishlist" class="product-link">
              <div class="p-card-img${product.image_url_hover ? " has-hover-img" : ""}">
                ${imgHtml}
                ${soldOut ? `<div class="p-card-status-badge is-sold">Sold Out</div>` : ""}
                ${pctOff > 0 ? `<div class="p-card-badge">${pctOff}% OFF</div>` : ""}
              </div>
              <div class="p-card-body">
                <div class="p-card-title">${escapeHtml(product.title || '')}</div>
                <div class="p-card-pricing">${priceHtml}</div>
                ${soldOut ? `<div class="p-card-stock">Sold out</div>` : ""}
              </div>
            </a>
            <div style="padding:0 14px 16px;">
              <button
                type="button"
                class="btn secondary js-remove"
                style="width: 100%;"
                data-id="${escapeAttr(product.id)}">
                Remove
              </button>
            </div>
          </div>
        `;
      }).join('');

      // Wire remove buttons
      wishlistGrid.querySelectorAll('.js-remove').forEach(btn => {
        btn.addEventListener('click', async () => {
          const productId = btn.getAttribute('data-id');
          if (!productId) return;
          if (!confirm('Remove this item from wishlist?')) return;

          const { success } = await removeFromWishlist(productId);
          if (success) loadWishlist();
        });
      });
    }
  </script>
</body>
</html>
