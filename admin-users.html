<!doctype html>
<html>
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-CKQ1EXBHY6"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-CKQ1EXBHY6');
  </script>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Registered Users — AhamStree Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css" />

  <style>
    .filters-bar { display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center; }
    .filters-bar .input { height:40px;font-size:13px; }
    .pager { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:14px; justify-content:space-between; }
    .pager .small { opacity:1; color:var(--text-light); }

    .tabs { display:flex; gap:6px; border-bottom:1px solid var(--border-light); margin-bottom:18px; }
    .tab-btn {
      background:none; border:none; padding:10px 4px; margin-right:14px; font-size:13px; font-weight:700;
      color:var(--text-light); cursor:pointer; border-bottom:2px solid transparent;
    }
    .tab-btn.active { color: var(--brand); border-bottom-color: var(--brand); }
    .tab-panel { display:none; }
    .tab-panel.active { display:block; }

    .user-card {
      border:1px solid var(--border-light); background:var(--surface);
      padding:14px 16px; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:center;
    }
    .user-card + .user-card { margin-top:10px; }
    .user-main { display:flex; flex-direction:column; gap:3px; }
    .user-name { font-weight:700; font-size:14.5px; }
    .user-sub { font-size:12.5px; color:var(--text-light); }
    .user-meta { display:flex; flex-direction:column; align-items:flex-end; gap:4px; text-align:right; }

    .pill {
      display:inline-flex; align-items:center; padding:3px 9px; border-radius:999px;
      font-size:10.5px; font-weight:700; letter-spacing:.02em; gap:4px;
    }
    .pill.google  { background:var(--indigo-light); color:var(--indigo); }
    .pill.phone   { background:rgba(63,107,79,.1); color:#3f6b4f; }
    .pill.email   { background:var(--accent-gold-light); color:var(--accent-gold); }
    .pill.unknown { background:var(--border-light); color:var(--text-light); }
    .pill.never   { background:rgba(161,61,61,.09); color:#a13d3d; }

    .event-row {
      border:1px solid var(--border-light); background:var(--surface);
      padding:12px 14px; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:center;
      font-size:13px;
    }
    .event-row + .event-row { margin-top:8px; }
    .event-left { display:flex; flex-direction:column; gap:2px; }
    .event-right { text-align:right; color:var(--text-light); font-size:12px; }

    .filter-chip {
      display:inline-flex; align-items:center; gap:8px; padding:6px 12px; border-radius:999px;
      background: var(--brand-lighter); border:1px solid var(--brand); font-size:12.5px; font-weight:700;
      margin-bottom:14px;
    }
    .filter-chip button { background:none; border:none; cursor:pointer; font-weight:700; color:var(--text-light); }

    #toast {
      position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
      background:var(--text);color:#fff;padding:10px 20px;font-size:13px;
      font-weight:700;opacity:0;transition:all .25s ease;pointer-events:none;z-index:9999;white-space:nowrap;
    }
    #toast.show { opacity:1;transform:translateX(-50%) translateY(0); }

    .section-lbl { font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-light);margin-bottom:4px; }
    #custTable th, #custTable td { white-space:nowrap; }
    #custTable td:nth-child(3) { white-space:normal; }
  </style>
</head>

<body>
  <div id="header"></div>

  <div class="container" style="max-width:1000px;">
    <div id="loadingState" style="text-align:center;padding:48px;color:var(--text-light);font-size:14px;">Verifying admin access…</div>

    <div id="mainContent" style="display:none;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:18px;">
        <div>
          <h2 style="margin:0;">Registered Users</h2>
          <div class="small" style="color:var(--text-light);margin-top:4px;">Every account that's signed up, and a full login history for each one.</div>
        </div>
        <a class="btn secondary" href="admin.html" style="padding:8px 14px;font-size:13px;">← Dashboard</a>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="customers">Customers</button>
        <button class="tab-btn" data-tab="users">Users</button>
        <button class="tab-btn" data-tab="history">All Login Activity</button>
        <button class="tab-btn" data-tab="visits">Pages Visited</button>
      </div>

      <!-- ── Customers tab — every registered account PLUS every walk-in
           order's customer, merged into one row per person (matched by
           phone number). This is the broader view "Users" can't give you:
           a manually-created walk-in order (admin-create-order.html) has no
           account at all, so it never showed up there. ── -->
      <div id="tab-customers" class="tab-panel active">
        <div class="filters-bar">
          <input id="custSearch" class="input" placeholder="Search name, email, or phone…" style="max-width:280px;" />
          <select id="custModeFilter" class="input" style="max-width:180px;">
            <option value="">All modes</option>
            <option value="registered">Registered only</option>
            <option value="walkin">Walk-in only</option>
            <option value="both">Both</option>
          </select>
          <button id="btnCustSearch" class="btn secondary" style="padding:8px 16px;font-size:13px;">Search</button>
          <button id="btnCustRefresh" class="btn secondary" style="padding:8px 16px;font-size:13px;">↻ Refresh</button>
        </div>
        <div id="custStatusMsg" class="small" style="margin-bottom:12px;color:var(--text-light);"></div>
        <div style="overflow-x:auto;">
          <table id="custTable" style="width:100%;border-collapse:collapse;font-size:13px;min-width:920px;">
            <thead>
              <tr style="text-align:left;border-bottom:2px solid var(--border,#e5e7eb);">
                <th style="padding:8px 10px;">Name</th>
                <th style="padding:8px 10px;">Phone</th>
                <th style="padding:8px 10px;">Email</th>
                <th style="padding:8px 10px;">Mode</th>
                <th style="padding:8px 10px;">City / State</th>
                <th style="padding:8px 10px;text-align:right;">Orders</th>
                <th style="padding:8px 10px;text-align:right;">Total Spent</th>
                <th style="padding:8px 10px;">Last Order</th>
                <th style="padding:8px 10px;">First Seen</th>
                <th style="padding:8px 10px;text-align:right;">AhamStree Cash</th>
              </tr>
            </thead>
            <tbody id="custTableBody"></tbody>
          </table>
        </div>
        <div class="pager">
          <div class="small" id="custPagerInfo"></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button id="custBtnPrev" class="btn secondary" style="padding:8px 14px;font-size:13px;">← Prev</button>
            <button id="custBtnNext" class="btn secondary" style="padding:8px 14px;font-size:13px;">Next →</button>
          </div>
        </div>
      </div>

      <!-- ── Customer Detail — reached only by clicking a name/phone in the
           Customers tab (no tab-bar button of its own). ── -->
      <div id="tab-customer-detail" class="tab-panel">
        <button id="custDetailBack" class="btn secondary" style="padding:6px 12px;font-size:12px;margin-bottom:14px;">← Back to Customers</button>
        <div id="custDetailHeader" class="card" style="padding:16px;margin-bottom:16px;"></div>

        <div class="section-lbl">Orders</div>
        <div id="custDetailOrders" style="margin-bottom:20px;"></div>

        <div class="section-lbl">Login history</div>
        <div id="custDetailLogins" style="margin-bottom:20px;"></div>

        <div class="section-lbl">Pages visited</div>
        <div id="custDetailVisits"></div>
      </div>

      <!-- ── Users tab ── -->
      <div id="tab-users" class="tab-panel">
        <div class="filters-bar">
          <input id="userSearch" class="input" placeholder="Search name, email, or phone…" style="max-width:320px;" />
          <button id="btnUserSearch" class="btn secondary" style="padding:8px 16px;font-size:13px;">Search</button>
          <button id="btnUserRefresh" class="btn secondary" style="padding:8px 16px;font-size:13px;">↻ Refresh</button>
          <button id="btnUserExportCsv" class="btn secondary" style="padding:8px 16px;font-size:13px;">Export CSV</button>
        </div>
        <div id="userStatusMsg" class="small" style="margin-bottom:12px;color:var(--text-light);"></div>
        <div id="userList" style="display:grid;gap:0;"></div>
        <div class="pager">
          <div class="small" id="userPagerInfo"></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button id="userBtnPrev" class="btn secondary" style="padding:8px 14px;font-size:13px;">← Prev</button>
            <button id="userBtnNext" class="btn secondary" style="padding:8px 14px;font-size:13px;">Next →</button>
          </div>
        </div>
      </div>

      <!-- ── Login history tab ── -->
      <div id="tab-history" class="tab-panel">
        <div id="historyFilterChip" style="display:none;"></div>
        <div id="historyStatusMsg" class="small" style="margin-bottom:12px;color:var(--text-light);"></div>
        <div id="historyList"></div>
        <div class="pager">
          <div class="small" id="historyPagerInfo"></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button id="historyBtnPrev" class="btn secondary" style="padding:8px 14px;font-size:13px;">← Prev</button>
            <button id="historyBtnNext" class="btn secondary" style="padding:8px 14px;font-size:13px;">Next →</button>
          </div>
        </div>
      </div>

      <!-- ── Pages visited tab — which links a registered user has clicked
           through the site, sourced from the same site_visits tracking
           already powering Visitor Analytics, just filterable to one
           person instead of only aggregate charts. ── -->
      <div id="tab-visits" class="tab-panel">
        <div id="visitsFilterChip" style="display:none;"></div>
        <div id="visitsStatusMsg" class="small" style="margin-bottom:12px;color:var(--text-light);"></div>
        <div id="visitsList"></div>
        <div class="pager">
          <div class="small" id="visitsPagerInfo"></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button id="visitsBtnPrev" class="btn secondary" style="padding:8px 14px;font-size:13px;">← Prev</button>
            <button id="visitsBtnNext" class="btn secondary" style="padding:8px 14px;font-size:13px;">Next →</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast"></div>
  <div id="footer"></div>

  <script type="module">
    import { renderHeader, renderFooter, hydrateHeaderAuth } from "./assets/ui.js";
    import { supabase } from "./assets/supabase.js";
    import { escapeHtml, safeHref } from "./assets/safe.js";

    document.getElementById("header").innerHTML = renderHeader("admin");
    document.getElementById("footer").innerHTML = renderFooter();
    hydrateHeaderAuth();

    const loadingState = document.getElementById("loadingState");
    const mainContent  = document.getElementById("mainContent");

    const ICON_WARN = '<svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>';
    const ICON_LOCK = '<svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="1"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';

    function showAdminError(icon, title, message) {
      loadingState.style.display = "block";
      mainContent.style.display = "none";
      loadingState.innerHTML =
        '<div style="min-height:50vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;">' +
          '<div style="color:var(--accent-gold);">' + icon + '</div>' +
          '<h3 style="margin:0;">' + title + '</h3>' +
          '<div class="small" style="opacity:.8;">' + message + '</div>' +
          '<a class="btn secondary" href="index.html" style="margin-top:8px;">Go to store</a>' +
        '</div>';
    }

    function toast(msg, color = "var(--text)") {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.style.background = color;
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 3500);
    }

    async function callFn(name, body) {
      const { data, error } = await supabase.functions.invoke(name, { body: body || {} });
      if (error) {
        if (error.status === 401) { window.location.href = "login.html"; return { ok: false, handled: true }; }
        if (error.status === 403) { showAdminError(ICON_LOCK, "Access Denied", "Your account does not have admin access."); return { ok: false, handled: true }; }
        let msg = error.message || "Function error";
        try {
          if (error.context && typeof error.context.json === "function") {
            const body2 = await error.context.json();
            if (body2?.details) msg = body2.error ? `${body2.error} (${body2.details})` : String(body2.details);
            else if (body2?.error) msg = body2.error;
          }
        } catch (_) {}
        throw new Error(msg);
      }
      return { ok: true, data };
    }

    function fmtDate(iso) {
      if (!iso) return "—";
      const d = new Date(iso);
      return d.toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" }) +
        " · " + d.toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" });
    }

    function money(n) {
      return "₹" + Number(n || 0).toLocaleString("en-IN", { maximumFractionDigits: 0 });
    }

    function modePill(mode) {
      const map = {
        registered: { cls: "unknown", label: "Registered" },
        walkin:     { cls: "phone",   label: "Walk-in" },
        both:       { cls: "google",  label: "Both" },
      };
      const m = map[mode] || { cls: "unknown", label: mode || "Unknown" };
      return `<span class="pill ${m.cls}">${m.label}</span>`;
    }

    function providerPill(provider) {
      const p = (provider || "unknown").toLowerCase();
      const cls = ["google", "phone", "email"].includes(p) ? p : "unknown";
      const label = p === "phone" ? "WhatsApp OTP" : p === "google" ? "Google" : p === "email" ? "Email" : "Unknown";
      return `<span class="pill ${cls}">${label}</span>`;
    }

    // ── Tabs ─────────────────────────────────────────────────────────────
    document.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
        document.querySelectorAll(".tab-panel").forEach((p) => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
      });
    });

    function switchToHistoryTab() {
      document.querySelectorAll(".tab-btn").forEach((b) => b.classList.toggle("active", b.dataset.tab === "history"));
      document.querySelectorAll(".tab-panel").forEach((p) => p.classList.toggle("active", p.id === "tab-history"));
    }

    function switchToVisitsTab() {
      document.querySelectorAll(".tab-btn").forEach((b) => b.classList.toggle("active", b.dataset.tab === "visits"));
      document.querySelectorAll(".tab-panel").forEach((p) => p.classList.toggle("active", p.id === "tab-visits"));
    }

    // Customer Detail has no tab-bar button of its own (only reachable by
    // clicking a customer) — so every real tab button is deselected while
    // it's showing, same as a master → detail drill-down elsewhere would
    // just replace the tab bar's highlighted state entirely.
    function switchToCustomerDetailTab() {
      document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
      document.querySelectorAll(".tab-panel").forEach((p) => p.classList.toggle("active", p.id === "tab-customer-detail"));
    }

    // ── Customers (unified: registered + walk-in, merged by phone) ─────────
    let custPage = 1;
    const custPerPage = 25;
    let custSearchTerm = "";
    let custModeTerm = "";
    let lastCustomers = [];

    async function loadCustomers() {
      const statusMsg = document.getElementById("custStatusMsg");
      const tbody = document.getElementById("custTableBody");
      statusMsg.textContent = "Loading…";

      const res = await callFn("admin-users", {
        action: "list_customers", page: custPage, per_page: custPerPage,
        search: custSearchTerm, mode: custModeTerm,
      });
      if (!res.ok) return;
      const { customers, total } = res.data;
      lastCustomers = customers;

      if (!customers.length) {
        tbody.innerHTML = `<tr><td colspan="10" class="small" style="color:var(--text-light);padding:24px 0;text-align:center;">No customers found.</td></tr>`;
        statusMsg.textContent = "";
      } else {
        tbody.innerHTML = customers.map((c, idx) => {
          const name = escapeHtml(c.full_name || "(No name saved)");
          const phone = escapeHtml(c.phone || "—");
          const cityState = [c.city, c.state].filter(Boolean).map(escapeHtml).join(", ") || "—";
          return `
            <tr style="border-bottom:1px solid var(--border-light,#f3f4f6);">
              <td style="padding:8px 10px;"><a href="#" class="cust-link" data-idx="${idx}" style="font-weight:700;color:inherit;text-decoration:underline;">${name}</a></td>
              <td style="padding:8px 10px;"><a href="#" class="cust-link" data-idx="${idx}" style="color:inherit;text-decoration:underline;">${phone}</a></td>
              <td style="padding:8px 10px;">${escapeHtml(c.email || "—")}</td>
              <td style="padding:8px 10px;">${modePill(c.mode)}</td>
              <td style="padding:8px 10px;">${cityState}</td>
              <td style="padding:8px 10px;text-align:right;">${c.order_count}</td>
              <td style="padding:8px 10px;text-align:right;font-weight:700;">${money(c.total_spent_inr)}</td>
              <td style="padding:8px 10px;">${c.last_order_at ? fmtDate(c.last_order_at) : "—"}</td>
              <td style="padding:8px 10px;">${fmtDate(c.created_at)}</td>
              <td style="padding:8px 10px;text-align:right;">${c.wallet_balance_inr != null ? money(c.wallet_balance_inr) : "—"}</td>
            </tr>`;
        }).join("");
        statusMsg.textContent = "";

        tbody.querySelectorAll("a.cust-link").forEach((a) => {
          a.addEventListener("click", (e) => {
            e.preventDefault();
            openCustomerDetail(lastCustomers[Number(a.dataset.idx)]);
          });
        });
      }

      const shown = customers.length;
      const start = (custPage - 1) * custPerPage;
      document.getElementById("custPagerInfo").textContent =
        total === 0 ? "" : `Showing ${start + 1}–${start + shown} of ${total}`;
      document.getElementById("custBtnPrev").disabled = custPage <= 1;
      document.getElementById("custBtnNext").disabled = start + shown >= total;
    }

    document.getElementById("btnCustSearch").addEventListener("click", () => {
      custSearchTerm = document.getElementById("custSearch").value.trim();
      custPage = 1;
      loadCustomers();
    });
    document.getElementById("custSearch").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("btnCustSearch").click();
    });
    document.getElementById("custModeFilter").addEventListener("change", () => {
      custModeTerm = document.getElementById("custModeFilter").value;
      custPage = 1;
      loadCustomers();
    });
    document.getElementById("btnCustRefresh").addEventListener("click", () => { custPage = 1; loadCustomers(); });
    document.getElementById("custBtnPrev").addEventListener("click", () => { if (custPage > 1) { custPage--; loadCustomers(); } });
    document.getElementById("custBtnNext").addEventListener("click", () => { custPage++; loadCustomers(); });

    // ── Customer Detail ──────────────────────────────────────────────────
    async function openCustomerDetail(customer) {
      switchToCustomerDetailTab();

      const header = document.getElementById("custDetailHeader");
      const ordersEl = document.getElementById("custDetailOrders");
      const loginsEl = document.getElementById("custDetailLogins");
      const visitsEl = document.getElementById("custDetailVisits");

      header.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;">
          <div>
            <div style="font-weight:700;font-size:16px;">${escapeHtml(customer.full_name || "(No name saved)")}</div>
            <div class="small" style="color:var(--text-light);margin-top:4px;">${escapeHtml([customer.phone, customer.email].filter(Boolean).join(" · ") || "No contact info")}</div>
            <div class="small" style="color:var(--text-light);margin-top:2px;">${escapeHtml([customer.city, customer.state].filter(Boolean).join(", "))}</div>
          </div>
          <div style="text-align:right;">
            ${modePill(customer.mode)}
            <div class="small" style="margin-top:6px;">First seen: ${fmtDate(customer.created_at)}</div>
            ${customer.wallet_balance_inr != null ? `<div class="small" style="margin-top:2px;">AhamStree Cash: <strong>${money(customer.wallet_balance_inr)}</strong></div>` : ""}
          </div>
        </div>
        <div style="display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--border-light,#f3f4f6);">
          <div class="small">Orders: <strong>${customer.order_count}</strong></div>
          <div class="small">Total spent: <strong>${money(customer.total_spent_inr)}</strong></div>
          <div class="small">Last order: <strong>${customer.last_order_at ? fmtDate(customer.last_order_at) : "—"}</strong></div>
          ${customer.is_registered ? `<div class="small">Logins: <strong>${customer.login_count}</strong></div>` : ""}
        </div>
      `;

      ordersEl.innerHTML = `<div class="small" style="color:var(--text-light);">Loading…</div>`;
      loginsEl.innerHTML = customer.is_registered ? `<div class="small" style="color:var(--text-light);">Loading…</div>` : `<div class="small" style="opacity:.6;">No account — walk-in customers have no login history.</div>`;
      visitsEl.innerHTML = customer.is_registered ? `<div class="small" style="color:var(--text-light);">Loading…</div>` : `<div class="small" style="opacity:.6;">No account — walk-in customers have no site-visit history.</div>`;

      // Orders — matches by user_id and/or phone, same as list_customers'
      // own attribution logic, so this always shows exactly the orders that
      // were counted into this customer's Orders/Total Spent above.
      const ordersRes = await callFn("admin-users", { action: "customer_orders", user_id: customer.user_id || undefined, phone: customer.phone || undefined });
      if (ordersRes.ok) {
        const orders = ordersRes.data.orders || [];
        ordersEl.innerHTML = orders.length ? orders.map((o) => {
          const itemsText = (o.order_items || []).map((it) => `${it.qty}× ${escapeHtml(it.title)}`).join(", ");
          return `
            <div class="event-row">
              <div class="event-left">
                <div><strong>${escapeHtml(o.order_number || o.id.slice(0, 8).toUpperCase())}</strong> — ${escapeHtml(String(o.status).replace(/_/g, " "))}</div>
                <div class="small" style="color:var(--text-light);">${itemsText || "—"}</div>
              </div>
              <div class="event-right">${money(o.total_inr)}<br>${fmtDate(o.created_at)}</div>
            </div>`;
        }).join("") : `<div class="small" style="color:var(--text-light);padding:12px 0;">No orders found.</div>`;
      } else {
        ordersEl.innerHTML = `<div class="small" style="color:#a13d3d;">Could not load orders.</div>`;
      }

      if (customer.is_registered && customer.user_id) {
        const loginRes = await callFn("admin-users", { action: "login_history", user_id: customer.user_id, per_page: 20 });
        if (loginRes.ok) {
          const events = loginRes.data.events || [];
          loginsEl.innerHTML = events.length ? events.map((e) => `
            <div class="event-row">
              <div class="event-left">
                <div>${providerPill(e.provider)}</div>
                <div class="small" style="color:var(--text-light);">${escapeHtml(e.ip_address || "IP unknown")}${[e.city, e.country].filter(Boolean).length ? " · " + escapeHtml([e.city, e.country].filter(Boolean).join(", ")) : ""}</div>
              </div>
              <div class="event-right">${fmtDate(e.created_at)}</div>
            </div>`).join("") : `<div class="small" style="color:var(--text-light);padding:12px 0;">No login activity yet.</div>`;
        } else {
          loginsEl.innerHTML = `<div class="small" style="color:#a13d3d;">Could not load login history.</div>`;
        }

        const visitsRes = await callFn("admin-users", { action: "page_visits", user_id: customer.user_id, per_page: 20 });
        if (visitsRes.ok) {
          const visits = visitsRes.data.visits || [];
          visitsEl.innerHTML = visits.length ? visits.map((v) => `
            <div class="event-row">
              <div class="event-left">
                <div><strong>${escapeHtml(v.page_path)}</strong></div>
                <div class="small" style="color:var(--text-light);">${[v.city, v.country].filter(Boolean).length ? escapeHtml([v.city, v.country].filter(Boolean).join(", ")) : ""}${v.device_type ? " · " + escapeHtml(v.device_type) : ""}</div>
              </div>
              <div class="event-right">${fmtDate(v.created_at)}</div>
            </div>`).join("") : `<div class="small" style="color:var(--text-light);padding:12px 0;">No page visits recorded yet.</div>`;
        } else {
          visitsEl.innerHTML = `<div class="small" style="color:#a13d3d;">Could not load page visits.</div>`;
        }
      }
    }

    document.getElementById("custDetailBack").addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach((b) => b.classList.toggle("active", b.dataset.tab === "customers"));
      document.querySelectorAll(".tab-panel").forEach((p) => p.classList.toggle("active", p.id === "tab-customers"));
    });

    // ── Users list ───────────────────────────────────────────────────────
    let userPage = 1;
    const userPerPage = 25;
    let userSearchTerm = "";

    async function loadUsers() {
      const statusMsg = document.getElementById("userStatusMsg");
      const list = document.getElementById("userList");
      statusMsg.textContent = "Loading…";

      const res = await callFn("admin-users", { action: "list", page: userPage, per_page: userPerPage, search: userSearchTerm });
      if (!res.ok) return;
      const { users, total } = res.data;

      if (!users.length) {
        list.innerHTML = '<div class="small" style="color:var(--text-light);padding:24px 0;text-align:center;">No users found.</div>';
        statusMsg.textContent = "";
      } else {
        list.innerHTML = users.map((u) => {
          const name = u.full_name || "(No name saved)";
          const contact = [u.email, u.phone].filter(Boolean).join(" · ") || "No contact info";
          const lastLogin = u.last_sign_in_at
            ? fmtDate(u.last_sign_in_at) + (u.last_login_provider ? " via " + u.last_login_provider : "")
            : null;
          return `
            <div class="user-card">
              <div class="user-main">
                <div class="user-name">${escapeHtml(name)}</div>
                <div class="user-sub">${escapeHtml(contact)}</div>
                <div class="user-sub">Signed up ${fmtDate(u.created_at)}${u.city ? " · " + escapeHtml(u.city) + (u.state ? ", " + escapeHtml(u.state) : "") : ""}</div>
              </div>
              <div class="user-meta">
                ${lastLogin ? providerPill(u.provider) : '<span class="pill never">Never logged in</span>'}
                <div class="small">${lastLogin ? "Last login: " + lastLogin : ""}</div>
                <div class="small" style="color:var(--text-light);">${u.login_count} login${u.login_count === 1 ? "" : "s"} logged</div>
                <div style="display:flex;gap:6px;">
                  <button class="btn secondary" style="padding:5px 10px;font-size:11.5px;margin-top:2px;" data-userid="${u.id}" data-username="${escapeHtml(name)}">View login history →</button>
                  <button class="btn secondary" style="padding:5px 10px;font-size:11.5px;margin-top:2px;" data-visits-userid="${u.id}" data-visits-username="${escapeHtml(name)}">Pages visited →</button>
                </div>
              </div>
            </div>`;
        }).join("");
        statusMsg.textContent = "";

        list.querySelectorAll("button[data-userid]").forEach((btn) => {
          btn.addEventListener("click", () => {
            filterUserId = btn.dataset.userid;
            filterUserName = btn.dataset.username;
            historyPage = 1;
            switchToHistoryTab();
            renderHistoryChip();
            loadHistory();
          });
        });

        list.querySelectorAll("button[data-visits-userid]").forEach((btn) => {
          btn.addEventListener("click", () => {
            visitsFilterUserId = btn.dataset.visitsUserid;
            visitsFilterUserName = btn.dataset.visitsUsername;
            visitsPage = 1;
            switchToVisitsTab();
            renderVisitsChip();
            loadVisits();
          });
        });
      }

      const shown = users.length;
      const start = (userPage - 1) * userPerPage;
      document.getElementById("userPagerInfo").textContent =
        total === 0 ? "" : `Showing ${start + 1}–${start + shown} of ${total}`;
      document.getElementById("userBtnPrev").disabled = userPage <= 1;
      document.getElementById("userBtnNext").disabled = start + shown >= total;
    }

    document.getElementById("btnUserSearch").addEventListener("click", () => {
      userSearchTerm = document.getElementById("userSearch").value.trim();
      userPage = 1;
      loadUsers();
    });
    document.getElementById("userSearch").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("btnUserSearch").click();
    });
    document.getElementById("btnUserRefresh").addEventListener("click", () => { userPage = 1; loadUsers(); });
    document.getElementById("userBtnPrev").addEventListener("click", () => { if (userPage > 1) { userPage--; loadUsers(); } });
    document.getElementById("userBtnNext").addEventListener("click", () => { userPage++; loadUsers(); });

    // CSV export — loops through every page of the current search filter
    // (customers were previously fully trapped in the UI with no export
    // path at all). Capped at 200 pages (5,000 customers) as a sanity limit.
    function toCsvCell(v) {
      const s = String(v ?? "");
      return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    }
    document.getElementById("btnUserExportCsv").addEventListener("click", async () => {
      const btn = document.getElementById("btnUserExportCsv");
      const oldText = btn.textContent;
      btn.disabled = true;
      btn.textContent = "Exporting…";
      try {
        let all = [];
        for (let p = 1; p <= 200; p++) {
          const res = await callFn("admin-users", { action: "list", page: p, per_page: userPerPage, search: userSearchTerm });
          if (!res.ok) break;
          const rows = res.data.users || [];
          all = all.concat(rows);
          if (rows.length < userPerPage) break;
        }
        const cols = ["id", "full_name", "email", "phone", "city", "state", "created_at", "last_sign_in_at", "login_count"];
        const header = cols.join(",");
        const csvRows = all.map(u => cols.map(c => toCsvCell(u[c])).join(","));
        const csv = [header, ...csvRows].join("\n");
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `ahamstree-customers-${new Date().toISOString().slice(0, 10)}.csv`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      } catch (e) {
        alert("Export failed: " + e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = oldText;
      }
    });

    // ── Login history (global or filtered to one user) ─────────────────
    let historyPage = 1;
    const historyPerPage = 25;
    let filterUserId = null;
    let filterUserName = null;

    function renderHistoryChip() {
      const chip = document.getElementById("historyFilterChip");
      if (!filterUserId) { chip.style.display = "none"; chip.innerHTML = ""; return; }
      chip.style.display = "block";
      chip.innerHTML = `<span class="filter-chip">Filtered: ${escapeHtml(filterUserName || "user")} <button id="clearHistoryFilter">✕</button></span>`;
      document.getElementById("clearHistoryFilter").addEventListener("click", () => {
        filterUserId = null; filterUserName = null; historyPage = 1;
        renderHistoryChip();
        loadHistory();
      });
    }

    async function loadHistory() {
      const statusMsg = document.getElementById("historyStatusMsg");
      const list = document.getElementById("historyList");
      statusMsg.textContent = "Loading…";

      const body = { action: "login_history", page: historyPage, per_page: historyPerPage };
      if (filterUserId) body.user_id = filterUserId;

      const res = await callFn("admin-users", body);
      if (!res.ok) return;
      const { events, total } = res.data;

      if (!events.length) {
        list.innerHTML = '<div class="small" style="color:var(--text-light);padding:24px 0;text-align:center;">No login activity yet.</div>';
      } else {
        list.innerHTML = events.map((e) => {
          const who = e.full_name || e.email || "Unknown user";
          const location = [e.city, e.country].filter(Boolean).join(", ");
          return `
            <div class="event-row">
              <div class="event-left">
                <div><strong>${escapeHtml(who)}</strong> ${providerPill(e.provider)}</div>
                <div class="small" style="color:var(--text-light);">${escapeHtml(e.ip_address || "IP unknown")}${location ? " · " + escapeHtml(location) : ""}</div>
              </div>
              <div class="event-right">${fmtDate(e.created_at)}</div>
            </div>`;
        }).join("");
      }
      statusMsg.textContent = "";

      const shown = events.length;
      const start = (historyPage - 1) * historyPerPage;
      document.getElementById("historyPagerInfo").textContent =
        total === 0 ? "" : `Showing ${start + 1}–${start + shown} of ${total}`;
      document.getElementById("historyBtnPrev").disabled = historyPage <= 1;
      document.getElementById("historyBtnNext").disabled = start + shown >= total;
    }

    document.querySelector('.tab-btn[data-tab="users"]').addEventListener("click", () => {
      if (!document.getElementById("userList").innerHTML) loadUsers();
    });

    document.querySelector('.tab-btn[data-tab="history"]').addEventListener("click", () => {
      if (!document.getElementById("historyList").innerHTML) loadHistory();
    });
    document.getElementById("historyBtnPrev").addEventListener("click", () => { if (historyPage > 1) { historyPage--; loadHistory(); } });
    document.getElementById("historyBtnNext").addEventListener("click", () => { historyPage++; loadHistory(); });

    // ── Pages visited (global feed of registered-user visits, or filtered
    // to one user via the "Pages visited →" button on their user card) ────
    let visitsPage = 1;
    const visitsPerPage = 25;
    let visitsFilterUserId = null;
    let visitsFilterUserName = null;

    function renderVisitsChip() {
      const chip = document.getElementById("visitsFilterChip");
      if (!visitsFilterUserId) { chip.style.display = "none"; chip.innerHTML = ""; return; }
      chip.style.display = "block";
      chip.innerHTML = `<span class="filter-chip">Filtered: ${escapeHtml(visitsFilterUserName || "user")} <button id="clearVisitsFilter">✕</button></span>`;
      document.getElementById("clearVisitsFilter").addEventListener("click", () => {
        visitsFilterUserId = null; visitsFilterUserName = null; visitsPage = 1;
        renderVisitsChip();
        loadVisits();
      });
    }

    async function loadVisits() {
      const statusMsg = document.getElementById("visitsStatusMsg");
      const list = document.getElementById("visitsList");
      statusMsg.textContent = "Loading…";

      const body = { action: "page_visits", page: visitsPage, per_page: visitsPerPage };
      if (visitsFilterUserId) body.user_id = visitsFilterUserId;

      const res = await callFn("admin-users", body);
      if (!res.ok) return;
      const { visits, total } = res.data;

      if (!visits.length) {
        list.innerHTML = '<div class="small" style="color:var(--text-light);padding:24px 0;text-align:center;">No page visits recorded yet.</div>';
      } else {
        list.innerHTML = visits.map((v) => {
          const who = v.full_name || v.email || "Unknown user";
          const location = [v.city, v.country].filter(Boolean).join(", ");
          return `
            <div class="event-row">
              <div class="event-left">
                <div><strong><a href="${safeHref(v.page_path)}" target="_blank" rel="noopener">${escapeHtml(v.page_path)}</a></strong></div>
                <div class="small" style="color:var(--text-light);">${escapeHtml(who)}${location ? " · " + escapeHtml(location) : ""}${v.device_type ? " · " + escapeHtml(v.device_type) : ""}</div>
              </div>
              <div class="event-right">${fmtDate(v.created_at)}</div>
            </div>`;
        }).join("");
      }
      statusMsg.textContent = "";

      const shown = visits.length;
      const start = (visitsPage - 1) * visitsPerPage;
      document.getElementById("visitsPagerInfo").textContent =
        total === 0 ? "" : `Showing ${start + 1}–${start + shown} of ${total}`;
      document.getElementById("visitsBtnPrev").disabled = visitsPage <= 1;
      document.getElementById("visitsBtnNext").disabled = start + shown >= total;
    }

    document.querySelector('.tab-btn[data-tab="visits"]').addEventListener("click", () => {
      if (!document.getElementById("visitsList").innerHTML) loadVisits();
    });
    document.getElementById("visitsBtnPrev").addEventListener("click", () => { if (visitsPage > 1) { visitsPage--; loadVisits(); } });
    document.getElementById("visitsBtnNext").addEventListener("click", () => { visitsPage++; loadVisits(); });

    // ── Boot ─────────────────────────────────────────────────────────────
    async function initAdmin() {
      try {
        const sessResult = await supabase.auth.getSession();
        if (sessResult.error) { showAdminError(ICON_WARN, "Auth Error", sessResult.error.message); return; }
        if (!sessResult.data || !sessResult.data.session) { window.location.href = "login.html"; return; }

        loadingState.style.display = "none";
        mainContent.style.display = "block";
        loadCustomers();
      } catch (e) {
        console.error("Admin page error:", e);
        showAdminError(ICON_WARN, "Something went wrong", e.message || "An unexpected error occurred.");
      }
    }

    initAdmin();
  </script>
</body>
</html>
