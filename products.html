<!doctype html>
<html>
<head>
  <!-- Google tag (gtag.js) -->

  <script>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Handloom Chanderi Sarees & Suits | AhamStree</title>
  <meta name="description" content="Shop handwoven Chanderi sarees and suits at AhamStree — filter by weave and fabric. Real title/description load per view below." />
  <meta name="robots" content="index, follow" />
  <meta property="og:site_name" content="AhamStree" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://www.ahamstree.com/hero-1-launch.jpg" />
  <!-- Title, description, canonical, OG tags, and CollectionPage/Breadcrumb JSON-LD are set
       dynamically per weave/fabric/collection filter once data loads (see assets/seo.js). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css" />
  <style>
    /* ── Products Page Hero ── */
    .products-hero {
      background: linear-gradient(160deg, var(--bg-warm) 0%, #ede5d8 100%);
      border-bottom: 1px solid var(--border-light);
      padding: 44px 16px 38px;
      position: relative;
      overflow: hidden;
    }
    .products-hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 60% 100% at 100% 50%, rgba(110,34,54,0.06) 0%, transparent 60%);
      pointer-events: none;
    }
    .products-hero-inner {
      max-width: 1320px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }
    .products-hero-kicker {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--brand);
      margin-bottom: 10px;
      opacity: 0.8;
    }
    .products-hero h1 {
      font-family: var(--font-heading);
      font-size: clamp(32px, 5vw, 56px);
      font-weight: 600;
      color: var(--text);
      margin: 0 0 8px;
      line-height: 1.08;
    }
    .products-hero h1 em { font-style: italic; color: var(--brand); }
    .products-hero-sub {
      font-size: 14px;
      color: var(--text-light);
      margin: 0;
    }

    /* ── Listing Layout ── */
    .listing-body {
      max-width: 1320px;
      margin: 0 auto;
      padding: 28px 16px 64px;
    }

    /* ── Category tabs ── driven by the CATEGORIES config in the script
       below — adding a category there is all a future third category
       needs to appear here. */
    .category-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .category-tabs::-webkit-scrollbar { display: none; }
    /* Underlined tabs rather than filled lozenges: the rest of the site was
       flattened to sharp corners (--radius-* are all 0), so 999px pills here
       were the last thing still reading as a different, older design. */
    .category-tab {
      display: inline-flex;
      align-items: center;
      padding: 6px 2px;
      margin-right: 18px;
      border: none;
      background: none;
      font-family: var(--font-heading);
      font-size: 20px;
      font-weight: 600;
      color: var(--text-light);
      cursor: pointer;
      white-space: nowrap;
      text-decoration: none;
      border-bottom: 2px solid transparent;
      transition: color 0.2s, border-color 0.2s;
    }
    .category-tab:hover { color: var(--brand); }
    .category-tab.active {
      color: var(--text);
      border-bottom-color: var(--brand);
    }

    /* ── Weave pill row ── smaller than the category tabs, sits just above
       the filter bar. Not a dropdown — every weave with at least one
       matching product (under whatever else is currently filtered) gets
       its own directly-clickable pill. */
    .weave-pill-row {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .weave-pill-row:empty { display: none; }
    .weave-pill-row::-webkit-scrollbar { display: none; }
    .weave-pill {
      display: inline-flex;
      align-items: center;
      height: 34px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 0;
      background: var(--surface);
      font-size: 13px;
      font-weight: 500;
      color: var(--text-light);
      cursor: pointer;
      white-space: nowrap;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }
    .weave-pill:hover { border-color: var(--accent-gold); color: var(--accent-gold); }
    .weave-pill.active {
      background: var(--accent-gold);
      border-color: var(--accent-gold);
      color: #fff;
      font-weight: 600;
    }

    /* ── Filter pill bar ── replaces the old single "Filter" button; each
       pill opens its own small panel and applies the moment you pick an
       option, instead of requiring a separate "Apply" click. */
    .filter-bar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      row-gap: 10px;
      column-gap: 8px;
      padding: 12px;
      background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      margin-bottom: 24px;
      box-shadow: var(--shadow-xs);
    }
    .filter-pill-set { display: contents; }
    .filter-pill-wrap { position: relative; flex: 0 0 auto; }
    .filter-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 38px;
      max-width: 220px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 0;
      background: var(--surface);
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
      transition: border-color 0.2s, color 0.2s, background 0.2s, box-shadow 0.2s;
    }
    .filter-pill:hover { border-color: var(--brand); color: var(--brand); }
    .filter-pill-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 160px;
    }
    /* One active-state definition, always gold, regardless of whether the
       panel happens to be open at the same time — previously "selected" and
       "open" fought over the pill's color (open always won, so a selected
       pill visually looked unselected the moment you reopened it). */
    .filter-pill.is-active {
      border-color: var(--accent-gold);
      color: var(--accent-gold);
      background: rgba(184,134,59,0.08);
      font-weight: 600;
    }
    /* "Open" now only ever adds a focus ring; it never overrides a pill's
       own resting/active color underneath. */
    .filter-pill-wrap.open .filter-pill {
      box-shadow: 0 0 0 3px var(--brand-lighter);
    }
    .filter-pill-wrap.open .filter-pill:not(.is-active) {
      border-color: var(--brand);
      color: var(--brand);
    }
    .filter-pill-caret { transition: transform 0.2s; flex-shrink: 0; }
    .filter-pill-wrap.open .filter-pill-caret { transform: rotate(180deg); }

    /* "Clear all" is an action, not a filter — deliberately not pill-shaped
       so it doesn't read as just another chip in the row. */
    .filter-clear-btn {
      display: inline-flex;
      align-items: center;
      height: 38px;
      padding: 0 8px;
      border: none;
      background: none;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-light);
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
      flex: 0 0 auto;
      transition: color 0.2s;
    }
    .filter-clear-btn:hover { color: var(--brand); }

    .filter-pill-panel {
      display: none;
      /* position: fixed (not absolute) — .filter-bar scrolls horizontally
         (overflow-x: auto), which forces its overflow-y to auto as well per
         the CSS spec and clips any absolutely-positioned child that pokes
         out below it. Fixed positioning escapes that clipping; exact
         top/left are set in JS from the trigger button's own rect when a
         panel opens. */
      position: fixed;
      z-index: 40;
      min-width: 220px;
      max-height: 320px;
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md, 0 8px 24px rgba(0,0,0,0.12));
      padding: 10px;
    }
    .filter-pill-wrap.open .filter-pill-panel { display: block; }
    .filter-pill-panel .filter-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 6px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 13px;
    }
    .filter-pill-panel .filter-option:hover { background: var(--bg-warm); }
    .filter-panel-price { display: flex; flex-direction: column; gap: 10px; min-width: 200px; }
    .filter-panel-price .price-row { display: flex; gap: 8px; }
    .filter-panel-price .price-row input { width: 90px; }

    .filter-bar-spacer { flex: 1 1 auto; min-width: 12px; }
    .toolbar-count-v2 {
      font-size: 13px;
      color: var(--text-light);
      white-space: nowrap;
      flex: 0 0 auto;
    }
    .toolbar-sort-v2 {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      padding: 8px 12px;
      font-size: 13px;
      color: var(--text);
      width: auto;
      max-width: 170px;
      flex: 0 0 auto;
      cursor: pointer;
    }

    /* ── Mobile filter bar + bottom sheet ──
       The pill bar used to keep its single row on mobile and scroll
       sideways with the scrollbar hidden, so "Occasion", "Price", "Clear
       all" and the whole sort dropdown were cut off the right edge with no
       hint they were there. Below 700px the bar is replaced by two buttons
       that open a sheet listing every filter vertically. */
    .mobile-filter-bar { display: none; }
    .mfb-btn {
      flex: 1 1 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 46px;
      padding: 0 14px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      overflow: hidden;
    }
    .mfb-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mfb-btn svg { flex-shrink: 0; }
    .mfb-count {
      flex-shrink: 0;
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      border-radius: 999px;
      background: var(--brand);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 1400;
      opacity: 0;
      transition: opacity .2s ease;
    }
    .sheet-backdrop.open { opacity: 1; }
    .filter-sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1401;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-top: 1px solid var(--border-light);
      box-shadow: 0 -10px 40px rgba(0,0,0,.16);
      transform: translateY(100%);
      transition: transform .24s ease;
    }
    .filter-sheet.open { transform: translateY(0); }
    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--border-light);
      flex-shrink: 0;
    }
    .sheet-title { font-family: var(--font-heading); font-size: 20px; font-weight: 600; }
    .sheet-close {
      border: none;
      background: none;
      color: var(--text-light);
      cursor: pointer;
      padding: 6px;
      display: inline-flex;
      min-width: 44px;
      min-height: 44px;
      align-items: center;
      justify-content: center;
    }
    .sheet-body { padding: 4px 16px 16px; overflow-y: auto; flex: 1 1 auto; -webkit-overflow-scrolling: touch; }
    .sheet-group + .sheet-group { border-top: 1px solid var(--border-light); margin-top: 4px; padding-top: 4px; }
    .sheet-group-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text-light);
      padding: 14px 0 6px;
    }
    .sheet-body .filter-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 2px;
      cursor: pointer;
      font-size: 15px;
      min-height: 44px;
      box-sizing: border-box;
    }
    .sheet-body .filter-option input { width: 18px; height: 18px; accent-color: var(--brand); flex-shrink: 0; }
    .sheet-foot {
      display: flex;
      gap: 10px;
      padding: 12px 16px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--border-light);
      background: var(--surface);
      flex-shrink: 0;
    }
    .sheet-foot .btn { flex: 1 1 0; min-height: 46px; }
    .sheet-foot .btn.secondary { flex: 0 0 auto; padding-left: 20px; padding-right: 20px; }

    /* Product grid, .p-card, and skeleton-loading styles now live in the
       shared assets/styles.css (used on the homepage too) — only this
       page's toolbar layout stays here. */
    @media (max-width: 700px) {
      .filter-bar { display: none; }
      .mobile-filter-bar { display: flex; gap: 8px; margin-bottom: 20px; }
      .category-tab { font-size: 18px; margin-right: 14px; }
    }
    @media (min-width: 701px) {
      /* Sheet is mobile-only; never let it appear on desktop even mid-transition. */
      .filter-sheet, .sheet-backdrop { display: none !important; }
    }
  </style>
</head>
<body>
  <div id="header"></div>

  <!-- Dynamic hero -->
  <section class="products-hero">
    <div class="products-hero-inner">
      <div class="products-hero-kicker">AhamStree</div>
      <h1 id="pageTitle">Handloom <em>Sarees</em></h1>
      <p class="products-hero-sub" id="pageSubtitle">Woven with care, made to last a lifetime.</p>
    </div>
  </section>

  <div class="listing-body">

    <!-- Category tabs (config-driven — see CATEGORIES in the script below) -->
    <div id="categoryTabs" class="category-tabs" role="tablist" aria-label="Category"></div>

    <!-- Weave pills (not a dropdown — see renderWeavePills() below) -->
    <div id="weavePillRow" class="weave-pill-row" role="tablist" aria-label="Weave"></div>

    <!-- Desktop/tablet: filter pill bar. Pills are built from the admin's
         filter settings (Admin → Product Catalogue → Filters), so which
         filters exist, what they're called and their order are all data. -->
    <div class="filter-bar" id="filterBar">
      <div class="filter-pill-set" id="filterPills"></div>

      <button type="button" class="filter-clear-btn" id="clearAll">Clear all</button>

      <div class="filter-bar-spacer"></div>
      <div id="itemsCount" class="toolbar-count-v2">&nbsp;</div>
      <select id="sortBy" class="toolbar-sort-v2" aria-label="Sort">
        <option value="newest">Newest first</option>
        <option value="mostLoved">Most loved</option>
        <option value="priceLow">Price: Low to High</option>
        <option value="priceHigh">Price: High to Low</option>
      </select>
    </div>

    <!-- Mobile: two buttons instead of a pill row that ran off the screen
         edge. Both open the sheet below. -->
    <div class="mobile-filter-bar" id="mobileFilterBar">
      <button type="button" class="mfb-btn" id="mfbFilters" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 5h18M6 12h12M10 19h4"/></svg>
        <span>Filters</span>
        <span class="mfb-count" id="mfbCount" hidden>0</span>
      </button>
      <button type="button" class="mfb-btn" id="mfbSort" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16m0 0-3-3m3 3 3-3M17 20V4m0 0-3 3m3-3 3 3"/></svg>
        <span id="mfbSortLabel">Newest first</span>
      </button>
    </div>

    <!-- Bottom sheet (mobile) — every filter group stacked vertically so
         nothing is ever clipped off the right edge. -->
    <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
    <div class="filter-sheet" id="filterSheet" role="dialog" aria-modal="true" aria-label="Filters" hidden>
      <div class="sheet-head">
        <div class="sheet-title" id="sheetTitle">Filters</div>
        <button type="button" class="sheet-close" id="sheetClose" aria-label="Close">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="sheet-body" id="sheetBody"></div>
      <div class="sheet-foot">
        <button type="button" class="btn secondary" id="sheetClear">Clear all</button>
        <button type="button" class="btn" id="sheetApply">Show <span id="sheetCount">results</span></button>
      </div>
    </div>


    <div id="status" class="small" style="margin-bottom:12px;"></div>

    <!-- Skeletons shown on first load -->
    <div id="skeletonState" class="skeleton-grid">
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
    </div>

    <div id="grid" class="product-grid"></div>

    <div id="loadMoreRow" class="load-more-wrap" style="display:none;">
      <button id="loadMore" class="btn secondary" type="button">Load more</button>
    </div>
    <div id="scrollSentinel" style="height:1px;"></div>
  </div>

  <div id="footer"></div>

<script type="module">
  import { renderHeader, renderFooter, hydrateHeaderAuth } from "./assets/ui.js";
  import { supabase } from "./assets/supabase.js";
  import { escapeHtml, escapeAttr, safeSrc } from "./assets/safe.js";
  import { hoverImageUrl } from "./assets/media.js";
  import { addToWishlist, removeFromWishlist, isInWishlist } from "./assets/wishlist.js";
  import { setPageMeta, injectJsonLd, buildCollectionSchema, buildBreadcrumbSchema, truncateForMeta } from "./assets/seo.js";

  const _typeForHeader = (new URL(location.href)).searchParams.get("type");
  document.getElementById("header").innerHTML = renderHeader((_typeForHeader && _typeForHeader.toLowerCase()==="suit") ? "suits" : "products");
  document.getElementById("footer").innerHTML = renderFooter();
  hydrateHeaderAuth();

  const status = document.getElementById("status");
  const grid = document.getElementById("grid");
  const itemsCount = document.getElementById("itemsCount");
  const skeleton = document.getElementById("skeletonState");

  const url = new URL(location.href);
  const params = url.searchParams;

  function numOrNull(v) {
    if (v === null || v === undefined) return null;
    const s = String(v).trim();
    if (s === "") return null;
    const n = Number(s);
    return Number.isFinite(n) ? n : null;
  }

  function setParam(k, v){
    if (v === null || v === undefined || v === "") params.delete(k);
    else params.set(k, String(v));
    const qs = params.toString();
    history.replaceState({}, "", qs ? (url.pathname + "?" + qs) : url.pathname);
  }

  function moneyINR(v){
    const n = Number(v);
    if (!Number.isFinite(n)) return "";
    return "₹" + n.toLocaleString("en-IN");
  }

  // A product counts as "New" for NEW_WINDOW_DAYS from the moment its row was
  // first created (created_at), never from when it was last edited
  // (updated_at) — editing a product's price/stock/description should not
  // reset its "New" clock.
  const NEW_WINDOW_DAYS = 60;
  function isNew(createdAt){
    if (!createdAt) return false;
    return (Date.now() - new Date(createdAt).getTime()) < NEW_WINDOW_DAYS * 24 * 60 * 60 * 1000;
  }

  // FIX: Sarees and Suits used to share one unfiltered list of collections
  // and fabrics — a collection or fabric that only had suits in it still
  // showed up as a filter option while browsing sarees (and just led to
  // "No products in this collection yet"). Both are now scoped to products
  // of the type actually being browsed, via the same ?type= this page
  // already filters its product grid by.
  const currentType = (params.get("type") || "saree").toLowerCase();

  // ── Filter configuration ──
  // Which filters this category offers, what they're called, and their
  // order all come from filter_settings / category_settings, edited in
  // Admin → Product Catalogue → Filters. The defaults seeded there match
  // what this page used to hardcode, so an untouched store looks the same.
  //
  // Free-text attribute filters read straight off a products column. Any
  // of them still hides itself when the current result set has fewer than
  // 2 distinct values — a filter with one option can't filter anything.
  const TEXT_FILTER_COLUMNS = {
    colour: "colour",
    occasion: "occasion",
    print_type: "print_type",
    craft: "craft",
    motif: "motif",
    border_type: "border_type",
    zari: "zari",
  };

  let filterDefs = [];                       // [{filter_key, label, sort_order}] — enabled only
  let categoryDefs = [];                     // [{category, label, all_weaves_label}]
  let categoryMeta = { label: "", all_weaves_label: "All Weaves" };
  const optionsByKey = {};                   // filter_key -> [{value,label}]

  const FALLBACK_FILTERS = [
    { filter_key: "fabric", label: "Fabric", sort_order: 1 },
    { filter_key: "collection", label: "Collection", sort_order: 2 },
    { filter_key: "colour", label: "Colour", sort_order: 3 },
    { filter_key: "occasion", label: "Occasion", sort_order: 4 },
    { filter_key: "price", label: "Price", sort_order: 5 },
  ];
  const FALLBACK_CATEGORIES = [
    { category: "saree", label: "Sarees", all_weaves_label: "All Weaves" },
    { category: "suit", label: "Suits", all_weaves_label: "All Weaves" },
  ];

  async function loadFilterConfig(){
    try {
      const [{ data: fRows }, { data: cRows }] = await Promise.all([
        supabase.from("filter_settings").select("filter_key,label,is_enabled,sort_order").eq("category", currentType),
        supabase.from("category_settings").select("category,label,all_weaves_label,heading,subtitle,show_weave_row,sort_order,is_enabled").order("sort_order"),
      ]);

      filterDefs = (fRows || [])
        .filter(f => f.is_enabled)
        .sort((a, b) => (a.sort_order ?? 0) - (b.sort_order ?? 0));
      if (!filterDefs.length) filterDefs = FALLBACK_FILTERS.slice();

      categoryDefs = (cRows || []).filter(c => c.is_enabled !== false);
      if (!categoryDefs.length) categoryDefs = FALLBACK_CATEGORIES.slice();
    } catch (e) {
      // Never let a config-fetch hiccup leave the shop with no filters at all.
      filterDefs = FALLBACK_FILTERS.slice();
      categoryDefs = FALLBACK_CATEGORIES.slice();
    }
    categoryMeta = categoryDefs.find(c => c.category === currentType) || { label: currentType, all_weaves_label: "All Weaves" };
  }

  function renderCategoryTabs(){
    const box = document.getElementById("categoryTabs");
    box.innerHTML = categoryDefs.map(c => {
      const p = new URLSearchParams();
      p.set("type", c.category);
      const active = c.category === currentType;
      return `<a class="category-tab${active ? " active" : ""}" href="products.html?${p.toString()}" data-type="${escapeAttr(c.category)}" role="tab" aria-selected="${active}">${escapeHtml(c.label)}</a>`;
    }).join("");
  }

  // ── Desktop pill panels ── only one open at a time; a click outside, or
  // Escape, closes whichever is open. Pills are rebuilt on every refresh,
  // so these look up ".filter-pill-wrap" live rather than caching a list.
  function closeAllPanels(except){
    document.querySelectorAll(".filter-pill-wrap").forEach(w => {
      if (w !== except) {
        w.classList.remove("open");
        w.querySelector(".filter-pill")?.setAttribute("aria-expanded", "false");
      }
    });
  }
  // Panels are position:fixed (see CSS comment), so their placement has to
  // be computed from the trigger button's own rect each time one opens —
  // fixed elements don't participate in normal in-flow "position under the
  // button" layout the way absolute-positioned ones would.
  function positionPanel(btn, panel){
    const rect = btn.getBoundingClientRect();
    const panelWidth = Math.max(panel.offsetWidth, 220);
    let left = rect.left;
    if (left + panelWidth > window.innerWidth - 12) left = Math.max(12, window.innerWidth - 12 - panelWidth);
    panel.style.top = (rect.bottom + 8) + "px";
    panel.style.left = left + "px";
  }

  document.addEventListener("click", () => closeAllPanels(null));
  window.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeAllPanels(null); closeSheet(); } });
  window.addEventListener("resize", () => closeAllPanels(null));
  window.addEventListener("scroll", () => closeAllPanels(null), { passive: true });

  function clearAllFilters(){
    ["weave", "collection", "fabric", "min", "max", "inStock", "sort", ...Object.keys(TEXT_FILTER_COLUMNS)]
      .forEach(k => params.delete(k));
    history.replaceState({}, "", url.pathname + (params.get("type") ? ("?type=" + params.get("type")) : ""));
    document.getElementById("sortBy").value = "newest";
    closeAllPanels(null);
    refreshFiltersAndGrid();
  }
  document.getElementById("clearAll").addEventListener("click", clearAllFilters);
  document.getElementById("sheetClear").addEventListener("click", clearAllFilters);

  // How many filters are currently narrowing the results — drives the count
  // badge on the mobile "Filters" button.
  function activeFilterCount(){
    let n = 0;
    for (const def of filterDefs) {
      if (def.filter_key === "price") {
        if (params.get("min") || params.get("max") || params.get("inStock") === "true") n += 1;
      } else if (params.get(def.filter_key)) {
        n += 1;
      }
    }
    if (params.get("weave")) n += 1;
    return n;
  }

  // Every facet query below (loadCollections/loadFabrics/renderWeavePills/
  // loadTextAttributeFilter) needs to only offer options that still have at
  // least one matching product given every OTHER currently active filter —
  // otherwise you could pick a Weave and Fabric combination with zero
  // products and the Colour/Occasion panels would still cheerfully list
  // colours that don't exist in that combination. `exclude` is the
  // dimension currently being computed, which never constrains itself (so
  // its own sibling options stay pickable).
  function productConstraints(exclude){
    const c = [];
    if (exclude !== "collection" && params.get("collection") && cache.productIds) c.push(q => q.in("id", cache.productIds));
    if (exclude !== "fabric" && params.get("fabric") && cache.fabricId) c.push(q => q.eq("fabric_id", cache.fabricId));
    if (exclude !== "weave" && params.get("weave") && cache.weaveId) c.push(q => q.eq("weave_line_id", cache.weaveId));
    for (const [key, column] of Object.entries(TEXT_FILTER_COLUMNS)) {
      if (exclude !== key && params.get(key)) c.push(q => q.eq(column, params.get(key)));
    }
    if (exclude !== "price") {
      const min = numOrNull(params.get("min"));
      const max = numOrNull(params.get("max"));
      if (min !== null) c.push(q => q.gte("price_inr", min));
      if (max !== null) c.push(q => q.lte("price_inr", max));
    }
    if (exclude !== "stock" && params.get("inStock") === "true") c.push(q => q.gt("inventory_qty", 0));
    return c;
  }
  function applyConstraints(query, constraints){
    return constraints.reduce((q, fn) => fn(q), query);
  }

  // Each loader below just computes the option list for one dimension into
  // optionsByKey — nothing renders here. renderFilterSurfaces() then draws
  // that same data into both the desktop pill bar and the mobile sheet, so
  // the two can never drift apart.
  async function loadCollectionOptions(){
    let cq = supabase
      .from("collection_products")
      .select("collections!inner(id,name,slug,sort_order,created_at,is_active), products!inner(is_active,category,fabric_id,weave_line_id,colour,occasion,print_type,craft,motif,border_type,zari,price_inr,inventory_qty)")
      .eq("collections.is_active", true)
      .eq("products.is_active", true)
      .eq("products.category", currentType);
    // Collection facet is never self-excluded (there's nothing to exclude —
    // this query IS the collection dimension), but every other active
    // filter still narrows which collections can even appear here.
    if (params.get("fabric") && cache.fabricId) cq = cq.eq("products.fabric_id", cache.fabricId);
    if (params.get("weave") && cache.weaveId) cq = cq.eq("products.weave_line_id", cache.weaveId);
    for (const [key, column] of Object.entries(TEXT_FILTER_COLUMNS)) {
      if (params.get(key)) cq = cq.eq("products." + column, params.get(key));
    }
    { const min = numOrNull(params.get("min")); if (min !== null) cq = cq.gte("products.price_inr", min); }
    { const max = numOrNull(params.get("max")); if (max !== null) cq = cq.lte("products.price_inr", max); }
    if (params.get("inStock") === "true") cq = cq.gt("products.inventory_qty", 0);

    try {
      const { data, error } = await cq;
      if (error) throw error;
      const seen = new Map();
      for (const row of (data ?? [])) {
        const c = row.collections;
        if (c && !seen.has(c.id)) seen.set(c.id, c);
      }
      optionsByKey.collection = Array.from(seen.values())
        .sort((a, b) => (a.sort_order ?? 0) - (b.sort_order ?? 0) || String(b.created_at).localeCompare(String(a.created_at)))
        .map(c => ({ value: c.slug, label: c.name }));
    } catch(e){ optionsByKey.collection = []; }
  }

  async function loadFabricOptions(){
    try{
      let q = supabase
        .from("products")
        .select("fabrics!inner(id,name,slug,sort_order,is_active)")
        .eq("is_active", true)
        .eq("category", currentType)
        .eq("fabrics.is_active", true);
      q = applyConstraints(q, productConstraints("fabric"));
      const { data, error } = await q;
      if (error) throw error;

      const seen = new Map();
      for (const row of (data ?? [])) {
        const f = row.fabrics;
        if (f && !seen.has(f.id)) seen.set(f.id, f);
      }
      optionsByKey.fabric = Array.from(seen.values())
        .sort((a, b) => (a.sort_order ?? 0) - (b.sort_order ?? 0) || String(a.name).localeCompare(String(b.name)))
        .map(f => ({ value: f.slug, label: f.name }));
    } catch(e){ optionsByKey.fabric = []; }
  }

  // Weave (weave_lines) had no in-page filter control at all before this
  // redesign — only reachable via a ?weave= link from the homepage's "Shop
  // by Weave" tiles. Rendered as its own row of directly-clickable pills
  // (not a dropdown, per request) — a weave with zero matching products
  // under whatever else is currently filtered simply never gets a pill; a
  // weave never constrains against itself so its own siblings stay visible.
  async function renderWeavePills(){
    const row = document.getElementById("weavePillRow");
    const selected = params.get("weave") || "";
    // Admin can switch the whole weave row off for a category.
    if (categoryMeta.show_weave_row === false){ row.innerHTML = ""; return; }
    try{
      let q = supabase
        .from("products")
        .select("weave_lines!inner(id,name,slug,sort_order,is_active)")
        .eq("is_active", true)
        .eq("category", currentType)
        .eq("weave_lines.is_active", true);
      q = applyConstraints(q, productConstraints("weave"));
      const { data, error } = await q;
      if (error) throw error;

      const seen = new Map();
      for (const row2 of (data ?? [])) {
        const w = row2.weave_lines;
        if (w && !seen.has(w.id)) seen.set(w.id, w);
      }
      const rows = Array.from(seen.values()).sort((a, b) =>
        (a.sort_order ?? 0) - (b.sort_order ?? 0) || String(a.name).localeCompare(String(b.name))
      );

      if (rows.length === 0){ row.innerHTML = ""; return; }

      const activeRow = rows.find(w => w.slug === selected);
      row.innerHTML = `
        <button type="button" class="weave-pill${selected ? "" : " active"}" data-slug="" role="tab" aria-selected="${selected ? "false" : "true"}">${escapeHtml(categoryMeta.all_weaves_label || "All Weaves")}</button>
        ${rows.map(w => `
          <button type="button" class="weave-pill${w.slug === selected ? " active" : ""}" data-slug="${escapeAttr(w.slug)}" role="tab" aria-selected="${w.slug === selected ? "true" : "false"}">${escapeHtml(w.name)}</button>
        `).join("")}
      `;
      // If the previously-selected weave no longer has a matching pill
      // (e.g. another filter picked afterward eliminated it), fall back to
      // "All Weaves" instead of quietly filtering by a slug with no UI.
      if (selected && !activeRow) setParam("weave", "");

      Array.from(row.querySelectorAll(".weave-pill")).forEach(btn => {
        btn.addEventListener("click", () => {
          setParam("weave", btn.dataset.slug);
          refreshFiltersAndGrid();
        });
      });
    } catch(e){ row.innerHTML = ""; }
  }

  // Colour, Occasion, Print Type, Craft, Motif, Border and Zari are all
  // free-text fields on the product itself (set in admin-products.html)
  // rather than their own lookup tables. A filter only appears once at
  // least two products in this category carry different values for it —
  // one option can't narrow anything. Tag more products in admin and the
  // filter fills in on its own.
  async function loadTextAttributeOptions(key){
    const column = TEXT_FILTER_COLUMNS[key];
    try{
      let q = supabase
        .from("products")
        .select(column)
        .eq("is_active", true)
        .eq("category", currentType)
        .not(column, "is", null);
      q = applyConstraints(q, productConstraints(key));
      const { data, error } = await q;
      if (error) throw error;

      const values = Array.from(new Set(
        (data ?? []).map(r => String(r[column] || "").trim()).filter(Boolean)
      )).sort((a, b) => a.localeCompare(b));

      optionsByKey[key] = values.length < 2 ? [] : values.map(v => ({ value: v, label: v }));
    } catch(e){ optionsByKey[key] = []; }
  }

  // ── Rendering the two filter surfaces ──
  function priceSummary(){
    const min = params.get("min");
    const max = params.get("max");
    const stock = params.get("inStock") === "true";
    const bits = [];
    if (min && max) bits.push(`₹${min}–₹${max}`);
    else if (min) bits.push(`Over ₹${min}`);
    else if (max) bits.push(`Under ₹${max}`);
    if (stock) bits.push("In stock");
    return bits.join(" · ");
  }

  function priceControlsHtml(){
    return `
      <div class="filter-panel-price">
        <div class="price-row">
          <input class="input f-min-price" placeholder="Min ₹" inputmode="numeric" value="${escapeAttr(params.get("min") || "")}" />
          <input class="input f-max-price" placeholder="Max ₹" inputmode="numeric" value="${escapeAttr(params.get("max") || "")}" />
        </div>
        <label class="filter-option" style="padding-left:0;">
          <input type="checkbox" class="f-in-stock" ${params.get("inStock") === "true" ? "checked" : ""} />
          <span>In Stock Only</span>
        </label>
        <button class="btn f-apply-price" type="button" style="width:100%;">Apply</button>
      </div>
    `;
  }

  function optionListHtml(key, groupName){
    const opts = optionsByKey[key] || [];
    const selected = params.get(key) || "";
    return `
      <label class="filter-option">
        <input type="radio" name="${escapeAttr(groupName)}" value="" ${selected ? "" : "checked"} />
        <span>All</span>
      </label>
      ${opts.map(o => `
        <label class="filter-option">
          <input type="radio" name="${escapeAttr(groupName)}" value="${escapeAttr(o.value)}" ${o.value === selected ? "checked" : ""} />
          <span>${escapeHtml(o.label)}</span>
        </label>
      `).join("")}
    `;
  }

  // A filter is worth showing only if it can actually narrow things down.
  function visibleFilterDefs(){
    return filterDefs.filter(def =>
      def.filter_key === "price" || (optionsByKey[def.filter_key] || []).length > 0
    );
  }

  function selectedLabelFor(key){
    const selected = params.get(key) || "";
    if (!selected) return "";
    const opt = (optionsByKey[key] || []).find(o => o.value === selected);
    return opt ? opt.label : "";
  }

  function renderDesktopPills(){
    const host = document.getElementById("filterPills");
    host.innerHTML = visibleFilterDefs().map(def => {
      const key = def.filter_key;
      const isPrice = key === "price";
      const selectedText = isPrice ? priceSummary() : selectedLabelFor(key);
      const labelText = selectedText ? `${def.label}: ${selectedText}` : def.label;
      return `
        <div class="filter-pill-wrap" data-pill="${escapeAttr(key)}">
          <button type="button" class="filter-pill${selectedText ? " is-active" : ""}" aria-haspopup="true" aria-expanded="false">
            <span class="filter-pill-label">${escapeHtml(labelText)}</span>
            <svg class="filter-pill-caret" viewBox="0 0 12 8" width="10" height="7" aria-hidden="true"><path d="M1 1l5 5 5-5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="filter-pill-panel" role="menu">
            ${isPrice ? priceControlsHtml() : optionListHtml(key, "d_" + key)}
          </div>
        </div>
      `;
    }).join("");

    host.querySelectorAll(".filter-pill-wrap").forEach(wrap => {
      const btn = wrap.querySelector(".filter-pill");
      const panel = wrap.querySelector(".filter-pill-panel");
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const willOpen = !wrap.classList.contains("open");
        closeAllPanels(willOpen ? wrap : null);
        if (willOpen) positionPanel(btn, panel);
        wrap.classList.toggle("open", willOpen);
        btn.setAttribute("aria-expanded", willOpen ? "true" : "false");
      });
      panel.addEventListener("click", (e) => e.stopPropagation());
    });

    wireOptionInputs(host, "d_", () => closeAllPanels(null));
    wirePriceControls(host);
  }

  function renderSheet(){
    const body = document.getElementById("sheetBody");
    const sortSel = document.getElementById("sortBy");
    const currentSort = sortSel.value;

    // Sort lives in the sheet too — on mobile the <select> in the desktop
    // bar is hidden, and both mobile buttons open this one panel.
    const sortHtml = `
      <div class="sheet-group">
        <div class="sheet-group-title">Sort by</div>
        ${Array.from(sortSel.options).map(o => `
          <label class="filter-option">
            <input type="radio" name="m_sort" value="${escapeAttr(o.value)}" ${o.value === currentSort ? "checked" : ""} />
            <span>${escapeHtml(o.textContent)}</span>
          </label>
        `).join("")}
      </div>
    `;

    body.innerHTML = sortHtml + visibleFilterDefs().map(def => {
      const key = def.filter_key;
      return `
        <div class="sheet-group">
          <div class="sheet-group-title">${escapeHtml(def.label)}</div>
          ${key === "price" ? priceControlsHtml() : optionListHtml(key, "m_" + key)}
        </div>
      `;
    }).join("");

    body.querySelectorAll('input[name="m_sort"]').forEach(input => {
      input.addEventListener("change", () => {
        sortSel.value = input.value;
        sortSel.dispatchEvent(new Event("change"));
      });
    });

    wireOptionInputs(body, "m_", null);
    wirePriceControls(body);
  }

  // Picking an option applies it immediately (both surfaces) and recomputes
  // every OTHER filter's option list — a chosen Fabric can make some Colour
  // or Weave values stop having any matching products.
  function wireOptionInputs(root, prefix, afterChange){
    root.querySelectorAll('input[type="radio"]').forEach(input => {
      const key = (input.name || "").startsWith(prefix) ? input.name.slice(prefix.length) : null;
      // "sort" shares the m_ prefix but is not a filter — it has its own
      // handler that drives the existing <select>.
      if (!key || key === "sort") return;
      input.addEventListener("change", () => {
        setParam(key, input.value);
        if (afterChange) afterChange();
        refreshFiltersAndGrid();
      });
    });
  }

  function wirePriceControls(root){
    const apply = root.querySelector(".f-apply-price");
    if (!apply) return;
    apply.addEventListener("click", () => {
      setParam("min", root.querySelector(".f-min-price")?.value.trim() || "");
      setParam("max", root.querySelector(".f-max-price")?.value.trim() || "");
      setParam("inStock", root.querySelector(".f-in-stock")?.checked ? "true" : "");
      closeAllPanels(null);
      refreshFiltersAndGrid();
    });
  }

  // ── Mobile sheet open/close ──
  const sheet = document.getElementById("filterSheet");
  const sheetBackdrop = document.getElementById("sheetBackdrop");

  function openSheet(){
    renderSheet();
    sheet.hidden = false;
    sheetBackdrop.hidden = false;
    // Force a reflow so the browser registers the offscreen start state and
    // the slide-up transition actually runs. Deliberately not
    // requestAnimationFrame: browsers throttle rAF when the page isn't
    // painting, which would leave the sheet stuck off the bottom of the
    // screen with no way to close it.
    void sheet.offsetHeight;
    sheet.classList.add("open");
    sheetBackdrop.classList.add("open");
    document.body.style.overflow = "hidden";
  }
  function closeSheet(){
    sheet.classList.remove("open");
    sheetBackdrop.classList.remove("open");
    document.body.style.overflow = "";
    setTimeout(() => {
      if (!sheet.classList.contains("open")) { sheet.hidden = true; sheetBackdrop.hidden = true; }
    }, 240);
  }
  document.getElementById("mfbFilters").addEventListener("click", openSheet);
  document.getElementById("mfbSort").addEventListener("click", openSheet);
  document.getElementById("sheetClose").addEventListener("click", closeSheet);
  document.getElementById("sheetApply").addEventListener("click", closeSheet);
  sheetBackdrop.addEventListener("click", closeSheet);

  function updateMobileBar(){
    const n = activeFilterCount();
    const badge = document.getElementById("mfbCount");
    badge.textContent = String(n);
    badge.hidden = n === 0;
    const sortSel = document.getElementById("sortBy");
    document.getElementById("mfbSortLabel").textContent =
      sortSel.options[sortSel.selectedIndex]?.textContent || "Newest first";
  }

  const PAGE_SIZE = 24;
  let offset = 0;
  let hasMore = true;
  let isLoading = false;

  const loadMoreRow = document.getElementById("loadMoreRow");
  const loadMoreBtn = document.getElementById("loadMore");
  const sentinel = document.getElementById("scrollSentinel");

  const cache = {
    collectionSlug: null, collectionId: null, collectionName: null, productIds: null,
    fabricSlug: null, fabricId: null, fabricName: null,
    weaveSlug: null, weaveId: null, weaveName: null
  };

  async function resolveCollection(slug){
    if (!slug) { cache.collectionSlug = null; cache.collectionId = null; cache.collectionName = null; cache.productIds = null; return null; }
    if (cache.collectionSlug === slug && cache.collectionId) return cache;
    const { data: col, error: colErr } = await supabase.from("collections").select("id,name").eq("slug", slug).maybeSingle();
    if (colErr || !col) return null;
    const { data: links, error: linkErr } = await supabase.from("collection_products").select("product_id").eq("collection_id", col.id);
    if (linkErr) return null;
    cache.collectionSlug = slug; cache.collectionId = col.id; cache.collectionName = col.name;
    cache.productIds = (links ?? []).map(x => x.product_id);
    return cache;
  }

  async function resolveFabric(slug){
    if (!slug) { cache.fabricSlug = null; cache.fabricId = null; cache.fabricName = null; return null; }
    if (cache.fabricSlug === slug && cache.fabricId) return cache;
    try{
      const { data: fab, error: fabErr } = await supabase.from("fabrics").select("id,name").eq("slug", slug).maybeSingle();
      if (fabErr || !fab) return null;
      cache.fabricSlug = slug; cache.fabricId = fab.id; cache.fabricName = fab.name;
      return cache;
    } catch(e){ return null; }
  }

  // FIX: this page used to silently ignore the ?weave= param entirely — a
  // "Shop by Weave" tile on the homepage (e.g. "Chanderi Cotton") linked
  // here with &weave=chanderi-cotton, but every saree in the store was
  // shown regardless, with no filtering by weave at all. That meant the
  // toolbar's item count and the grid below it both reflected the FULL
  // category, not the specific weave the visitor actually clicked into.
  async function resolveWeave(slug){
    if (!slug) { cache.weaveSlug = null; cache.weaveId = null; cache.weaveName = null; return null; }
    if (cache.weaveSlug === slug && cache.weaveId) return cache;
    try{
      const { data: wl, error: wlErr } = await supabase.from("weave_lines").select("id,name").eq("slug", slug).maybeSingle();
      if (wlErr || !wl) return null;
      cache.weaveSlug = slug; cache.weaveId = wl.id; cache.weaveName = wl.name;
      return cache;
    } catch(e){ return null; }
  }

  // Resolves every slug-based filter's id into `cache` up front — the facet
  // queries below (and productConstraints()) key off cache.fabricId /
  // cache.weaveId / cache.productIds, not the raw URL slug, so this has to
  // run before any of them.
  async function resolveActiveFilters(){
    await Promise.all([
      resolveCollection(params.get("collection") || ""),
      resolveFabric(params.get("fabric") || ""),
      resolveWeave(params.get("weave") || ""),
    ]);
  }

  // The single entry point every filter change goes through: re-resolves
  // the active slugs, recomputes every OTHER filter's option list against
  // the new combination (the "keep filters in sync" fix — picking one
  // filter can make some of another filter's values stop having any
  // matching products), and reloads the grid. Called instead of touching
  // resetAndLoad()/individual load*() functions directly.
  async function refreshFiltersAndGrid(){
    await resolveActiveFilters();

    // Only fetch options for the filters this category actually offers —
    // a disabled filter costs no query at all.
    const enabledKeys = new Set(filterDefs.map(d => d.filter_key));
    const jobs = [renderWeavePills()];
    if (enabledKeys.has("collection")) jobs.push(loadCollectionOptions()); else optionsByKey.collection = [];
    if (enabledKeys.has("fabric")) jobs.push(loadFabricOptions()); else optionsByKey.fabric = [];
    for (const key of Object.keys(TEXT_FILTER_COLUMNS)) {
      if (enabledKeys.has(key)) jobs.push(loadTextAttributeOptions(key));
      else optionsByKey[key] = [];
    }
    await Promise.all(jobs);

    // A previously-selected value can stop existing once another filter
    // narrows things — drop it rather than filtering by something with no
    // control on screen.
    for (const key of [...Object.keys(TEXT_FILTER_COLUMNS), "fabric", "collection"]) {
      const selected = params.get(key);
      if (selected && !(optionsByKey[key] || []).some(o => o.value === selected)) setParam(key, "");
    }

    renderDesktopPills();
    if (!sheet.hidden) renderSheet();
    updateMobileBar();
    resetAndLoad();
  }

  function setPageTitle(){
    const type = (params.get("type") || "saree").toLowerCase();
    const collection = params.get("collection") || "";
    const titleEl = document.getElementById("pageTitle");
    const subEl = document.getElementById("pageSubtitle");
    const weaveName = cache.weaveId ? cache.weaveName : "";

    if (collection && cache.collectionName){
      titleEl.innerHTML = escapeHtml(cache.collectionName);
      subEl.textContent = "A handpicked edit from our collection.";
      return;
    }

    // Heading and subtitle are admin-editable per category (Admin → Site
    // Settings → Navigation). The house style italicises the final word, so
    // a configured heading keeps that treatment automatically rather than
    // making the admin type markup.
    const configured = (categoryMeta.heading || "").trim();
    const fallbackHeading = type === "suit" ? "Handloom Suits" : "Handloom Sarees";
    const headingText = configured || fallbackHeading;

    if (weaveName) {
      // Browsing one weave swaps the leading words for the weave's name,
      // keeping the category word italicised: "Chanderi <em>Sarees</em>".
      titleEl.innerHTML = `${escapeHtml(weaveName)} <em>${escapeHtml(categoryMeta.label || (type === "suit" ? "Suits" : "Sarees"))}</em>`;
    } else {
      const words = headingText.split(/\s+/);
      const last = words.pop();
      titleEl.innerHTML = words.length
        ? `${escapeHtml(words.join(" "))} <em>${escapeHtml(last)}</em>`
        : `<em>${escapeHtml(last)}</em>`;
    }

    subEl.textContent = (categoryMeta.subtitle || "").trim() ||
      (type === "suit" ? "Crafted for everyday grace — from weave to wear." : "Woven with care, made to last a lifetime.");
  }

  // Returns the canonical path for the current type/weave/fabric/collection
  // combination — deliberately drops min/max/sort/inStock/page-state params
  // so those variations all consolidate onto the same canonical URL instead
  // of being treated as separate pages.
  function applySeoForListing(){
    const type = (params.get("type") || "saree").toLowerCase();
    const catLabel = type === "suit" ? "Suits" : "Sarees";
    const collectionName = params.get("collection") && cache.collectionName ? cache.collectionName : "";
    const weaveName = cache.weaveId ? cache.weaveName : "";
    const fabricName = cache.fabricId ? cache.fabricName : "";

    let title, description;
    if (collectionName) {
      title = `${collectionName} | AhamStree`;
      description = truncateForMeta(`Shop the ${collectionName} collection at AhamStree — handwoven Chanderi ${catLabel.toLowerCase()}, quality checked before dispatch.`);
    } else {
      const parts = [];
      parts.push(weaveName || "Chanderi");
      if (fabricName) parts.push(fabricName);
      const descriptor = parts.join(" ");
      title = `${descriptor} ${catLabel} | AhamStree`;
      description = truncateForMeta(`Shop handwoven ${descriptor} ${catLabel.toLowerCase()} at AhamStree — quality checked before dispatch, pan-India delivery.`);
    }

    const canonicalParams = new URLSearchParams();
    canonicalParams.set("type", type);
    if (params.get("weave")) canonicalParams.set("weave", params.get("weave"));
    if (params.get("fabric")) canonicalParams.set("fabric", params.get("fabric"));
    if (params.get("collection")) canonicalParams.set("collection", params.get("collection"));
    const canonicalPath = `/products.html?${canonicalParams.toString()}`;

    setPageMeta({ title, description, path: canonicalPath, type: "website" });
    injectJsonLd("ld-breadcrumb", buildBreadcrumbSchema([
      { name: "Home", path: "/" },
      { name: title.split(" | ")[0], path: canonicalPath },
    ]));

    return { title, canonicalPath };
  }

  function normalize(rows = []){
    return (rows ?? []).map(p => {
      const imgs = (p.product_images ?? []).slice().sort((a,b)=> (a.sort_order??0)-(b.sort_order??0));
      const inv = Number(p.inventory_qty || 0);
      const res = Number(p.reserved_qty || 0);
      const available_qty = Math.max(0, inv - res);
      const original_price = Number(p.price_inr || 0);
      const sale_price = (p.sale_price_inr === null || p.sale_price_inr === undefined) ? null : Number(p.sale_price_inr);
      const effective_price = (sale_price && sale_price > 0) ? sale_price : original_price;
      return { ...p, image_url: imgs[0]?.image_url ?? "", image_url_hover: hoverImageUrl(imgs[1]?.image_url), available_qty, _original_price_inr: original_price, _effective_price_inr: effective_price };
    });
  }

  function productCard(p, idx){
    const base = Number(p.price_inr || 0);
    const sale = p.sale_price_inr == null ? null : Number(p.sale_price_inr);
    const hasSale = sale != null && sale > 0 && sale < base;
    const pctOff = hasSale ? Math.round((1 - sale/base) * 100) : 0;
    const soldOut = Number(p.available_qty || 0) <= 0;
    const stockCount = Number(p.available_qty || 0);
    // Sold Out wins the top-left corner slot over New — once stock hits
    // zero, "recently added" stops being the useful thing to tell a shopper.
    const isNewItem = !soldOut && isNew(p.created_at);

    const priceHtml = hasSale
      ? `<span class="p-card-original">${moneyINR(base)}</span><span class="p-card-sale-price">${moneyINR(sale)}</span>`
      : `<span class="p-card-price">${moneyINR(base)}</span>`;

    const imgHtml = p.image_url
      ? `<img class="${p.image_url_hover ? "p-card-img-primary" : ""}" src="${safeSrc(p.image_url)}" alt="${escapeAttr(p.title)}" loading="lazy" decoding="async">${p.image_url_hover ? `<img class="p-card-img-hover" src="${safeSrc(p.image_url_hover)}" alt="" loading="lazy" decoding="async" aria-hidden="true">` : ""}`
      : `<div class="p-card-img-empty"></div>`;

    return `
      <div class="p-card" style="animation-delay:${(idx % 8) * 55}ms">
        <button type="button" class="p-card-wish" data-product-id="${escapeAttr(p.id)}" aria-label="Add to wishlist" aria-pressed="false">${heartIcon()}</button>
        <a class="product-link" href="product.html?${p.slug ? 'slug=' + encodeURIComponent(p.slug) : 'id=' + encodeURIComponent(p.id)}&from=products&type=${encodeURIComponent(params.get('type') || 'saree')}${params.get('collection') ? '&col=' + encodeURIComponent(params.get('collection')) + '&colName=' + encodeURIComponent(cache.collectionName || '') : ''}">
          <div class="p-card-img${p.image_url_hover ? " has-hover-img" : ""}">
            ${imgHtml}
            ${soldOut ? `<div class="p-card-status-badge is-sold">Sold Out</div>` : (isNewItem ? `<div class="p-card-status-badge is-new">New</div>` : "")}
            ${pctOff > 0 ? `<div class="p-card-badge">${pctOff}% OFF</div>` : ""}
          </div>
          <div class="p-card-body">
            <div class="p-card-title">${escapeHtml(p.title)}</div>
            <div class="p-card-pricing">${priceHtml}</div>
            ${!soldOut && stockCount <= 3 ? `<div class="p-card-stock low">Only ${stockCount} left</div>` : ""}
            ${soldOut ? `<div class="p-card-stock">Sold out</div>` : ""}
          </div>
        </a>
      </div>`;
  }

  function heartIcon() {
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>`;
  }

  // Card-grid wishlist hearts: wires clicks (add/remove, no navigation) and
  // paints the current saved state. isInWishlist() is one lookup per card —
  // instant from localStorage for a guest, one small Supabase query per card
  // if signed in. Fine at this catalog's size; would want a single bulk
  // lookup instead if the grid ever grows into the hundreds.
  function hydrateWishlistHearts(scope) {
    const buttons = scope.querySelectorAll(".p-card-wish");
    buttons.forEach(async (btn) => {
      const id = btn.dataset.productId;
      if (!id) return;
      try {
        if (await isInWishlist(id)) {
          btn.classList.add("is-active");
          btn.setAttribute("aria-pressed", "true");
        }
      } catch {}
    });
    if (scope.dataset.wishBound) return; // avoid re-binding the delegated listener on every page of results
    scope.dataset.wishBound = "1";
    scope.addEventListener("click", async (e) => {
      const btn = e.target.closest(".p-card-wish");
      if (!btn) return;
      e.preventDefault();
      e.stopPropagation();
      const id = btn.dataset.productId;
      if (!id) return;
      const active = btn.classList.toggle("is-active");
      btn.setAttribute("aria-pressed", active ? "true" : "false");
      try {
        if (active) await addToWishlist(id);
        else await removeFromWishlist(id);
      } catch {
        // revert on failure so the heart never lies about saved state
        btn.classList.toggle("is-active", !active);
        btn.setAttribute("aria-pressed", !active ? "true" : "false");
      }
    });
  }

  function updateLoadMoreUI(){
    if (hasMore) {
      loadMoreRow.style.display = "block";
      loadMoreBtn.disabled = false;
      loadMoreBtn.textContent = "Load more";
    } else {
      loadMoreRow.style.display = "none";
    }
  }

  async function loadNextPage(isFirst = false){
    if (isLoading || !hasMore) return;
    isLoading = true;

    if (isFirst){
      status.textContent = "";
      grid.innerHTML = "";
      offset = 0;
      hasMore = true;
      skeleton.style.display = "grid";
    } else {
      loadMoreBtn.textContent = "Loading…";
      loadMoreBtn.disabled = true;
    }

    const selectedSlug = params.get("collection") || "";
    const selectedFabricSlug = params.get("fabric") || "";
    const selectedWeaveSlug = params.get("weave") || "";
    const selectedColour = params.get("colour") || "";
    const selectedOccasion = params.get("occasion") || "";
    const min = numOrNull(params.get("min"));
    const max = numOrNull(params.get("max"));
    const sort = params.get("sort") || "newest";
    const inStockOnly = params.get("inStock") === "true";
    const type = (params.get("type") || "saree").toLowerCase();

    const col = await resolveCollection(selectedSlug);
    const fab = await resolveFabric(selectedFabricSlug);
    const weave = await resolveWeave(selectedWeaveSlug);
    setPageTitle();
    const seoInfo = applySeoForListing();

    if (selectedSlug){
      if (!col){ status.textContent = "Collection not found."; itemsCount.textContent = ""; skeleton.style.display = "none"; isLoading = false; return; }
      if (!cache.productIds || cache.productIds.length === 0){
        status.textContent = "No products in this collection yet.";
        itemsCount.textContent = "0 items";
        skeleton.style.display = "none";
        hasMore = false; updateLoadMoreUI(); isLoading = false; return;
      }
    }

    if (min !== null && max !== null && min > max) {
      status.textContent = "Min price cannot be greater than Max price.";
      skeleton.style.display = "none";
      isLoading = false; return;
    }

    if (isFirst){
      try{
        let countQ = supabase.from("products").select("id", { count: "exact", head: true }).eq("is_active", true).eq("category", type);
        if (selectedSlug) countQ = countQ.in("id", cache.productIds);
        if (fab && cache.fabricId) countQ = countQ.eq("fabric_id", cache.fabricId);
        if (weave && cache.weaveId) countQ = countQ.eq("weave_line_id", cache.weaveId);
        if (selectedColour) countQ = countQ.eq("colour", selectedColour);
        if (selectedOccasion) countQ = countQ.eq("occasion", selectedOccasion);
        if (min !== null) countQ = countQ.gte("price_inr", min);
        if (max !== null) countQ = countQ.lte("price_inr", max);
        if (inStockOnly) countQ = countQ.gt("inventory_qty", 0);
        const { count } = await countQ;
        itemsCount.textContent = typeof count === "number" ? `${count} item${count !== 1 ? "s" : ""}` : "";
      } catch(e){ itemsCount.textContent = ""; }
    }

    let query = supabase
      .from("products")
      .select("id,slug,title,price_inr,sale_price_inr,inventory_qty,reserved_qty,is_active,created_at,view_count,product_images(image_url, sort_order)")
      .eq("is_active", true)
      .eq("category", type);

    if (selectedSlug) query = query.in("id", cache.productIds);
    if (fab && cache.fabricId) query = query.eq("fabric_id", cache.fabricId);
    if (weave && cache.weaveId) query = query.eq("weave_line_id", cache.weaveId);
    if (selectedColour) query = query.eq("colour", selectedColour);
    if (selectedOccasion) query = query.eq("occasion", selectedOccasion);
    if (min !== null) query = query.gte("price_inr", min);
    if (max !== null) query = query.lte("price_inr", max);
    if (inStockOnly) query = query.gt("inventory_qty", 0);

    if (sort === "mostLoved") query = query.order("view_count", { ascending: false }).order("created_at", { ascending: false });
    else if (sort === "priceLow") query = query.order("price_inr", { ascending: true });
    else if (sort === "priceHigh") query = query.order("price_inr", { ascending: false });
    else query = query.order("created_at", { ascending: false });

    // Check if we need to restore a previous pagination + scroll state
    let restoreTarget = 0;
    if (isFirst) {
      try {
        const saved = JSON.parse(sessionStorage.getItem("scrollState:" + location.href) || "null");
        if (saved && saved.offset > PAGE_SIZE) restoreTarget = saved.offset;
      } catch(e) {}
    }

    if (restoreTarget > 0) {
      // Load all previously-seen items in one shot, plus one to probe hasMore
      query = query.range(0, restoreTarget);
    } else {
      query = query.range(offset, offset + PAGE_SIZE);
    }

    const { data, error } = await query;
    skeleton.style.display = "none";

    if (error){ status.textContent = "Error: " + error.message; isLoading = false; return; }

    let slice;
    if (restoreTarget > 0) {
      hasMore = (data ?? []).length > restoreTarget;
      slice = hasMore ? (data ?? []).slice(0, restoreTarget) : (data ?? []);
    } else {
      const rows = data ?? [];
      hasMore = rows.length > PAGE_SIZE;
      slice = hasMore ? rows.slice(0, PAGE_SIZE) : rows;
    }

    const normalized = normalize(slice);

    if (isFirst && normalized.length === 0){
      status.textContent = "No products found.";
      hasMore = false; updateLoadMoreUI(); isLoading = false; return;
    }

    grid.insertAdjacentHTML("beforeend", normalized.map((p, i) => productCard(p, offset + i)).join(""));
    hydrateWishlistHearts(grid);
    offset += slice.length;
    updateLoadMoreUI();
    isLoading = false;

    if (isFirst && normalized.length) {
      injectJsonLd("ld-collection", buildCollectionSchema({
        name: seoInfo.title.split(" | ")[0],
        path: seoInfo.canonicalPath,
        products: normalized.map(p => ({ title: p.title, path: p.slug ? `/product.html?slug=${encodeURIComponent(p.slug)}` : `/product.html?id=${encodeURIComponent(p.id)}` })),
      }));
    }

    // Restore scroll position after content renders
    if (isFirst) {
      try {
        const saved = JSON.parse(sessionStorage.getItem("scrollState:" + location.href) || "null");
        if (saved && saved.scrollY) {
          setTimeout(() => { window.scrollTo(0, saved.scrollY); }, 300);
          sessionStorage.removeItem("scrollState:" + location.href);
        }
      } catch(e) {}
    }
  }

  function resetAndLoad(){
    hasMore = true;
    offset = 0;
    loadNextPage(true);
  }

  // Init control values from URL. Price fields are rendered per surface
  // (see priceControlsHtml) and seeded from the params directly, so only
  // sort needs restoring here.
  document.getElementById("sortBy").value = params.get("sort") || "newest";

  document.getElementById("sortBy").addEventListener("change", (e) => {
    setParam("sort", e.target.value);
    updateMobileBar();
    resetAndLoad();
  });

  // Config has to land before anything renders — the tabs, the pills and
  // the sheet are all built from it.
  (async () => {
    await loadFilterConfig();
    renderCategoryTabs();
    await refreshFiltersAndGrid();
  })();

  loadMoreBtn.addEventListener("click", () => loadNextPage(false));

  if ("IntersectionObserver" in window) {
    const obs = new IntersectionObserver((entries) => {
      if (entries.some(e => e.isIntersecting)) loadNextPage(false);
    }, { rootMargin: "600px" });
    obs.observe(sentinel);
  }
</script>

<script>
  // Save scroll + offset state continuously so it's always up to date
  history.scrollRestoration = "manual";
  let _scrollSaveTimer;
  window.addEventListener("scroll", () => {
    clearTimeout(_scrollSaveTimer);
    _scrollSaveTimer = setTimeout(() => {
      try {
        sessionStorage.setItem("scrollState:" + location.href, JSON.stringify({ scrollY: window.scrollY, offset }));
      } catch(e) {}
    }, 200);
  }, { passive: true });
</script>

</body>
</html>
