<!doctype html>
<html>
<head>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Account — AhamStree</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div id="header"></div>

  <div class="container">
    <h2 style="margin-top:0;">Account</h2>

       <div id="app" class="card" style="padding:16px;border-radius:16px;max-width:680px;">
      <div class="small">Loading account…</div>
    </div>
  </div>

  <div id="footer"></div>

  <script type="module">
    import { renderHeader, renderFooter, hydrateHeaderAuth } from "./assets/ui.js";
    import { supabase } from "./assets/supabase.js";
    import { escapeHtml } from "./assets/safe.js";
    import { upsertProfileIfPending, ensureProfileFromPhone, ensureProfileFromGoogle } from "./assets/profile-seed.js";


    document.getElementById("header").innerHTML = renderHeader("login");
    hydrateHeaderAuth();
document.getElementById("footer").innerHTML = renderFooter();



    const app = document.getElementById("app");


    // If user came here from another page, we keep where to go next
    const __params = new URLSearchParams(location.search);
    const __nextRaw = __params.get("next");

    function getNextUrl() {
      if (!__nextRaw) return null;
      let decoded = "";
      try { decoded = decodeURIComponent(__nextRaw); } catch { decoded = __nextRaw; }
      decoded = String(decoded || "").trim();

      // SECURITY: prevent open redirects.
      // - Block absolute URLs like https://evil.com
      // - Block protocol-relative URLs like //evil.com
      if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(decoded)) return null;
      if (decoded.startsWith("//")) return null;
      if (decoded.includes("\n") || decoded.includes("\r")) return null;

      // Normalize to a single-leading-slash path
      decoded = "/" + decoded.replace(/^\/+/, "");

      // Allow home or any *.html (+ optional query/hash)
      if (decoded === "/") return decoded;
      const pathOnly = decoded.split(/[?#]/)[0];
      if (!pathOnly.endsWith(".html")) return null;
      return decoded;
    }

    const NEXT_URL = getNextUrl();


        function renderLoggedOut() {
  const iconGoogle = () => `
    <svg viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg">
      <path fill="#4285F4" d="M23.52 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.47a5.54 5.54 0 0 1-2.4 3.63v3h3.88c2.27-2.09 3.57-5.17 3.57-8.82Z"/>
      <path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.95-2.9l-3.88-3.02c-1.08.72-2.46 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.96H1.26v3.11A12 12 0 0 0 12 24Z"/>
      <path fill="#FBBC05" d="M5.27 14.27a7.2 7.2 0 0 1 0-4.54v-3.1H1.26a12 12 0 0 0 0 10.75l4.01-3.11Z"/>
      <path fill="#EA4335" d="M12 4.76c1.76 0 3.34.61 4.59 1.8l3.44-3.44C17.95 1.19 15.23 0 12 0A12 12 0 0 0 1.26 6.63l4.01 3.1C6.22 6.87 8.87 4.76 12 4.76Z"/>
    </svg>`;

  // Minimal inline icons (keeps this page self-contained)
  const iconPhone = () => `
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M8 3h8v18H8V3Z" stroke="currentColor" stroke-width="2"/>
      <path d="M10 18h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>`;
  const iconWhatsapp = () => `
    <svg viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg">
      <path fill="#25D366" d="M12 2C6.48 2 2 6.48 2 12c0 1.85.5 3.58 1.36 5.07L2 22l5.07-1.33A9.94 9.94 0 0 0 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2Z"/>
      <path fill="#fff" d="M9.1 7.28c-.2-.45-.4-.46-.6-.47h-.5c-.18 0-.46.07-.7.34-.24.27-.92.9-.92 2.2s.94 2.55 1.07 2.73c.13.18 1.83 2.93 4.5 4 2.23.88 2.68.7 3.17.66.49-.05 1.57-.64 1.79-1.26.22-.62.22-1.15.15-1.26-.07-.11-.24-.18-.5-.31-.27-.13-1.57-.78-1.82-.86-.24-.09-.42-.13-.6.13-.18.27-.68.86-.84 1.04-.15.18-.31.2-.58.07-.27-.13-1.13-.42-2.15-1.33-.8-.71-1.33-1.59-1.49-1.86-.15-.27-.02-.42.12-.55.12-.12.27-.31.4-.47.13-.16.18-.27.27-.45.09-.18.05-.34-.02-.47-.07-.13-.6-1.49-.85-2.05Z"/>
    </svg>`;

  app.innerHTML = `
    <div style="font-weight:900;">Login</div>
    <div class="small" style="margin-top:6px;">
      Continue with Google, or verify with a WhatsApp one-time code.
    </div>

    <button id="googleAuthBtn" type="button" class="btn secondary"
      style="display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:320px;margin-top:14px;">
      ${iconGoogle()} Continue with Google
    </button>

    <div style="display:flex;align-items:center;gap:10px;margin:16px 0;max-width:320px;color:#9ca3af;font-size:12px;">
      <span style="flex:1;height:1px;background:#e5e7eb;"></span>or<span style="flex:1;height:1px;background:#e5e7eb;"></span>
    </div>

    <div id="panel"></div>

    <div id="status" class="small" style="margin-top:10px;"></div>
  `;

  const panel = document.getElementById("panel");
  const status = document.getElementById("status");

  document.getElementById("googleAuthBtn").onclick = async () => {
    status.textContent = "Redirecting to Google…";
    const redirectTo =
      window.location.origin + "/login.html" +
      (NEXT_URL ? ("?next=" + encodeURIComponent(NEXT_URL)) : "");
    const { error } = await supabase.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo },
    });
    if (error) status.textContent = "Error: " + error.message;
  };

  const escapeHtml = (s) =>
    String(s ?? "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;",
    }[c]));

  const phoneOk = (v) => {
    const digits = String(v || "").replace(/\D/g, "");
    // India mobile: 10 digits starting 6-9 (allow +91 etc.)
    if (digits.length === 12 && digits.startsWith("91")) return /^[6-9]\d{9}$/.test(digits.slice(2));
    return /^[6-9]\d{9}$/.test(digits);
  };

  // Normalizes whatever the user typed (with or without +91/91/0 prefix)
  // down to the bare 10-digit Indian mobile number.
  const normalizePhone10 = (raw) => {
    let d = String(raw || "").replace(/\D/g, "");
    if (d.startsWith("91") && d.length === 12) d = d.slice(2);
    if (d.startsWith("0") && d.length === 11) d = d.slice(1);
    return d;
  };

  const toE164 = (phone10) => "+91" + phone10;

  // RESEND_COOLDOWN_SECONDS mirrors Supabase Auth's default 60-second
  // "last request" throttle on /auth/v1/otp — kept in sync here purely so
  // the button's countdown matches what the server will actually allow.
  // If that rate limit is changed in Authentication → Rate Limits, update
  // this constant to match.
  const RESEND_COOLDOWN_SECONDS = 60;

  function renderLogin() {
    let currentPhone10 = null; // set once an OTP has been sent
    let cooldownTimer = null;

    panel.innerHTML = `
      <div class="form-grid">
        <div class="field">
          <label for="otpPhone">WhatsApp number</label>
          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">${iconPhone()}</span>
            <input id="otpPhone" class="input has-icon" type="tel" autocomplete="tel"
              placeholder="10-digit mobile number" inputmode="numeric" required />
          </div>
          <div class="help-text">We’ll send a 6-digit code to this number on WhatsApp.</div>
          <div id="errOtpPhone" class="error-text" style="display:none;"></div>
        </div>
      </div>

      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;">
        <button id="sendOtpBtn" type="button" class="btn"
          style="display:flex;align-items:center;justify-content:center;gap:8px;">
          ${iconWhatsapp()} Send code on WhatsApp
        </button>
      </div>

      <div id="otpStep" style="display:none;margin-top:16px;">
        <div class="field">
          <label for="otpCode">Enter the 6-digit code</label>
          <input id="otpCode" class="input" type="text" inputmode="numeric" autocomplete="one-time-code"
            maxlength="6" placeholder="••••••" style="letter-spacing:4px;font-weight:700;max-width:180px;" />
          <div id="errOtpCode" class="error-text" style="display:none;"></div>
        </div>

        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center;">
          <button id="verifyOtpBtn" class="btn">Verify &amp; continue</button>
          <button id="resendOtpBtn" type="button" class="btn secondary" disabled>Resend code</button>
          <button id="changeNumberBtn" type="button" class="btn secondary">Change number</button>
        </div>
      </div>
    `;

    const phoneInput = document.getElementById("otpPhone");
    const sendBtn = document.getElementById("sendOtpBtn");
    const otpStep = document.getElementById("otpStep");
    const codeInput = document.getElementById("otpCode");
    const verifyBtn = document.getElementById("verifyOtpBtn");
    const resendBtn = document.getElementById("resendOtpBtn");
    const changeBtn = document.getElementById("changeNumberBtn");

    const setPhoneError = (msg) => {
      const err = document.getElementById("errOtpPhone");
      phoneInput.classList.toggle("is-invalid", !!msg);
      err.style.display = msg ? "block" : "none";
      err.textContent = msg || "";
    };
    const setCodeError = (msg) => {
      const err = document.getElementById("errOtpCode");
      codeInput.classList.toggle("is-invalid", !!msg);
      err.style.display = msg ? "block" : "none";
      err.textContent = msg || "";
    };

    function startCooldown(btn) {
      let remaining = RESEND_COOLDOWN_SECONDS;
      btn.disabled = true;
      btn.textContent = `Resend code (${remaining}s)`;
      if (cooldownTimer) clearInterval(cooldownTimer);
      cooldownTimer = setInterval(() => {
        remaining -= 1;
        if (remaining <= 0) {
          clearInterval(cooldownTimer);
          cooldownTimer = null;
          btn.disabled = false;
          btn.textContent = "Resend code";
        } else {
          btn.textContent = `Resend code (${remaining}s)`;
        }
      }, 1000);
    }

    async function sendOtp() {
      setPhoneError("");
      const phone10 = normalizePhone10(phoneInput.value);

      if (!phoneOk(phone10)) {
        setPhoneError("Enter a valid 10-digit Indian mobile number.");
        return;
      }

      sendBtn.disabled = true;
      status.textContent = "Sending code on WhatsApp…";

      const { error } = await supabase.auth.signInWithOtp({
        phone: toE164(phone10),
      });

      sendBtn.disabled = false;

      if (error) {
        status.textContent = "Error: " + error.message;
        return;
      }

      currentPhone10 = phone10;
      status.textContent = `Code sent to +91 ${phone10} on WhatsApp. It expires shortly — enter it below.`;
      otpStep.style.display = "block";
      phoneInput.disabled = true;
      sendBtn.style.display = "none";
      codeInput.value = "";
      codeInput.focus();
      startCooldown(resendBtn);
    }

    sendBtn.onclick = sendOtp;

    resendBtn.onclick = async () => {
      if (resendBtn.disabled) return;
      setCodeError("");
      status.textContent = "Resending code…";
      const { error } = await supabase.auth.signInWithOtp({
        phone: toE164(currentPhone10),
      });
      if (error) {
        status.textContent = "Error: " + error.message;
        return;
      }
      status.textContent = `New code sent to +91 ${currentPhone10} on WhatsApp.`;
      startCooldown(resendBtn);
    };

    changeBtn.onclick = () => {
      if (cooldownTimer) clearInterval(cooldownTimer);
      currentPhone10 = null;
      status.textContent = "";
      otpStep.style.display = "none";
      phoneInput.disabled = false;
      sendBtn.style.display = "flex";
      phoneInput.focus();
    };

    verifyBtn.onclick = async () => {
      setCodeError("");
      const code = codeInput.value.trim();

      if (!/^\d{6}$/.test(code)) {
        setCodeError("Enter the 6-digit code we sent you.");
        return;
      }
      if (!currentPhone10) {
        status.textContent = "Please request a code first.";
        return;
      }

      verifyBtn.disabled = true;
      status.textContent = "Verifying…";

      const { error } = await supabase.auth.verifyOtp({
        phone: toE164(currentPhone10),
        token: code,
        type: "sms",
      });

      verifyBtn.disabled = false;

      if (error) {
        status.textContent = "Error: " + error.message;
        return;
      }

      status.textContent = "Logged in ✅ Redirecting…";
      setTimeout(() => {
        window.location.href = (NEXT_URL || "/account.html");
      }, 500);
    };

    // Allow hitting Enter in either field to trigger the primary action.
    phoneInput.addEventListener("keydown", (e) => { if (e.key === "Enter") sendOtp(); });
    codeInput.addEventListener("keydown", (e) => { if (e.key === "Enter") verifyBtn.click(); });
  }

  // Default: show login form first
  renderLogin();
}



function renderLoggedIn(session) {

  // Already signed in: take user back to where they wanted to go
  if (NEXT_URL) {
    window.location.href = NEXT_URL;
    return;
  }

  const identity = session?.user?.email
    || (session?.user?.phone ? "+" + session.user.phone.replace(/\D/g, "") : "")
    || "your account";

  app.innerHTML = `
    <div style="font-weight:900;">My Account</div>
    <div class="small" style="margin-top:6px;">Signed in as ${escapeHtml(identity)}</div>

    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;">
      <a class="btn secondary" href="account.html?view=orders">Orders</a>
      <a class="btn secondary" href="account.html?view=profile">Profile</a>
      <button id="logout" class="btn">Log out</button>
    </div>
  `;

 document.getElementById("logout").onclick = async () => {
  await supabase.auth.signOut();
  window.location.href = "index.html"; // full redirect, clears all state
};
}

    // upsertProfileIfPending / ensureProfileFromPhone / ensureProfileFromGoogle
    // now live in assets/profile-seed.js (imported above) so the sign-in
    // popup can reuse the exact same seeding logic instead of a second copy.

    // Initial render — keyed off having a session at all, since a
    // WhatsApp-OTP (phone) session has no email to check.
    const { data: sessionData } = await supabase.auth.getSession();
  if (sessionData?.session?.user) renderLoggedIn(sessionData.session);
else renderLoggedOut();



    // Keep in sync if auth changes
    supabase.auth.onAuthStateChange(async (_event, session) => {
  hydrateHeaderAuth();

  const uid = session?.user?.id;

  if (uid) {
    await upsertProfileIfPending(uid);
    await ensureProfileFromGoogle(session);
    await ensureProfileFromPhone(session);
    renderLoggedIn(session);
  } else {
    renderLoggedOut();
  }
});

  </script>
</body>
</html>
