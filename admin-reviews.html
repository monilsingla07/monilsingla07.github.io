<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Reviews — AhamStree Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css" />
  <style>
    .admin-gate { min-height: 60vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; text-align: center; }
    .filters-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin: 14px 0; }
    .filters-bar .f { display: flex; flex-direction: column; gap: 3px; }
    .filters-bar label, .fld-label { font-size: 11px; color: var(--text-light); font-weight: 600; }
    .filters-bar .input { height: 40px; font-size: 13px; }
    .rv-list { display: grid; gap: 12px; }
    .rv-card { border: 1px solid var(--border-light); background: var(--surface); padding: 14px 16px; border-radius: var(--radius-panel, 0); }
    .rv-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
    .rv-stars { color: #b7791f; letter-spacing: 2px; font-size: 16px; white-space: nowrap; }
    .rv-title { font-weight: 700; font-size: var(--font-size-base, 15px); }
    .rv-meta { font-size: 12px; color: var(--text-light); margin-top: 4px; }
    .rv-body { margin: 8px 0 0; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .rv-note { margin-top: 6px; font-size: 12px; color: var(--text-light); font-style: italic; }
    .rv-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .rv-actions .btn { padding: 6px 12px; font-size: 12px; }
    .pill { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
    .pill.pending { background: rgba(183,121,31,.12); color: #8a5a12; }
    .pill.approved { background: rgba(63,107,79,.1); color: #3f6b4f; }
    .pill.rejected, .pill.spam { background: var(--border-light); color: var(--text-light); }
    .pager { display: flex; align-items: center; gap: 10px; justify-content: flex-end; margin: 12px 0; font-size: 13px; }
    .empty { padding: 32px; text-align: center; color: var(--text-light); border: 1px dashed var(--border); }
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 2000; display: none; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 40px 12px; }
    .modal-bg.open { display: flex; }
    .modal { background: var(--surface); width: 100%; max-width: 560px; padding: 22px; border: 1px solid var(--border); }
    .modal h3 { margin: 0 0 14px; }
    .m-row { margin-top: 12px; }
    .m-row .input { width: 100%; }
    .m-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
    .err { color: #a13d3d; font-size: 12px; margin-top: 8px; min-height: 16px; }
  </style>
</head>
<body>
  <div id="header"></div>

  <div class="container" style="max-width:1000px;">
    <div id="loadingState" style="text-align:center; padding:48px; color:var(--text-light);">Verifying admin access…</div>

    <div id="dashboard" style="display:none;">
      <div id="adminBreadcrumb"></div>
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; margin-bottom:12px;">
        <div>
          <h2 style="margin:0;">Reviews</h2>
          <div class="small" style="color:var(--text-light); margin-top:4px;">Customer reviews appear on the product page only after you approve them.</div>
        </div>
      </div>

      <div class="filters-bar">
        <div class="f"><label for="fStatus">Status</label>
          <select id="fStatus" class="input">
            <option value="pending" selected>Pending</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
            <option value="spam">Spam</option>
            <option value="all">All</option>
          </select></div>
        <div class="f"><label for="fProduct">Product</label>
          <select id="fProduct" class="input" style="max-width:260px;"><option value="">All products</option></select></div>
        <button class="btn secondary" id="btnApply" type="button" style="padding:9px 14px; font-size:13px;">Apply</button>
      </div>

      <div id="rvList" class="rv-list" aria-live="polite"><div class="empty">Loading…</div></div>
      <div class="pager">
        <span id="pagerInfo"></span>
        <button class="btn secondary" id="btnPrev" type="button" style="padding:6px 12px; font-size:12px;">‹ Prev</button>
        <button class="btn secondary" id="btnNext" type="button" style="padding:6px 12px; font-size:12px;">Next ›</button>
      </div>
    </div>
  </div>

  <!-- Edit modal -->
  <div class="modal-bg" id="editModal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="editTitleH">
      <h3 id="editTitleH">Edit review</h3>
      <div class="small" style="color:var(--text-light);">Fix typos before approving. The rating cannot be changed.</div>
      <div class="m-row"><label class="fld-label" for="editName">Display name</label><input id="editName" class="input" type="text" maxlength="60" /></div>
      <div class="m-row"><label class="fld-label" for="editTitle">Title</label><input id="editTitle" class="input" type="text" maxlength="100" /></div>
      <div class="m-row"><label class="fld-label" for="editBody">Review</label><textarea id="editBody" class="input" rows="6" maxlength="2000"></textarea></div>
      <div class="err" id="editErr" role="alert"></div>
      <div class="m-actions">
        <button class="btn secondary" id="editCancel" type="button">Cancel</button>
        <button class="btn" id="editSave" type="button">Save</button>
      </div>
    </div>
  </div>

  <!-- Reject modal -->
  <div class="modal-bg" id="rejectModal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="rejectTitleH">
      <h3 id="rejectTitleH">Reject review</h3>
      <div class="m-row"><label class="fld-label" for="rejectReason">Internal note (optional, never shown publicly)</label><input id="rejectReason" class="input" type="text" maxlength="300" /></div>
      <div class="m-actions">
        <button class="btn secondary" id="rejectCancel" type="button">Cancel</button>
        <button class="btn" id="rejectOk" type="button">Reject</button>
      </div>
    </div>
  </div>

  <div id="footer"></div>
  <script type="module" src="scripts/admin-reviews.js"></script>
</body>
</html>
