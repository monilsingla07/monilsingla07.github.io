<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Search — AhamStree</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="assets/styles.css" />
  <style>
    .search-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 16px;
    }
    
    .search-box {
      position: relative;
      margin-bottom: 32px;
    }
    
    .search-input {
      width: 100%;
      padding: 16px 20px;
      font-size: 18px;
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      transition: border-color 0.2s ease;
      font-family: var(--font-body);
    }
    
    .search-input:focus {
      border-color: var(--brand);
    }
    .search-pager { display:flex; align-items:center; justify-content:center; gap:16px; margin-top:28px; }
    .search-pager .btn { min-height:44px; }
    .search-pager button[disabled] { opacity:.45; cursor:not-allowed; }
    .search-pager-info { font-size:14px; color:var(--text-light); }
    .search-recovery { text-align:center; padding:32px 16px; }
    .search-recovery h2 { font-size:24px; margin:0 0 8px; }
    .search-recovery p { color:var(--text-light); margin:0 0 16px; }
    .search-recovery-links { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
    .search-recovery-links a { font-size:14px; font-weight:600; border:1.5px solid var(--border); padding:12px 18px; min-height:44px; display:inline-flex; align-items:center; }
    .search-recovery-links a:hover { border-color:var(--brand); color:var(--brand); }
    .p-card-matched { margin:0 0 6px; display:flex; flex-direction:column; gap:3px; }
    .match-badge { font-size:11px; color:var(--brand-dark); background:var(--brand-lighter); padding:2px 6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; align-self:flex-start; }
    
    .search-icon {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-light);
    }
    
    .search-status {
      text-align: center;
      padding: 20px;
      color: var(--text-light);
    }
    
    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
      margin-top: 32px;
    }

    @media (max-width: 768px) {
      .results-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
    }

    /* Shown before a query is entered (2+ chars) — was previously just a
       blank page below the input. Same "browse instead" quick links as the
       header search overlay, for anyone landing here directly. */
    .search-prompt-quicklinks {
      display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px;
    }
    .search-prompt-quicklinks a {
      font-size: 13px; font-weight: 600; text-decoration: none; color: var(--text);
      border: 1.5px solid var(--border); border-radius: 999px; padding: 9px 18px;
    }
    .search-prompt-quicklinks a:hover { border-color: var(--brand); color: var(--brand); background: var(--brand-lighter); }
  </style>
</head>

<body>
  <div id="header"></div>
  <main id="main" tabindex="-1">

  <div class="search-container">
    <h1 style="font-size: 32px; margin-bottom: 8px;">Search Products</h1>
    <p style="color: var(--text-light); margin-bottom: 24px;">
      Find your perfect saree from our handloom collection
    </p>

    <div class="search-box">
      <label for="searchInput" class="vh">Search products</label>
      <input 
        type="text" 
        id="searchInput" 
        class="search-input" 
        placeholder="Search for sarees, fabrics, colors..."
        autofocus
      />
      <svg class="search-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.35-4.35"></path>
      </svg>
    </div>

    <div id="searchStatus" class="search-status"></div>
    <div id="searchPrompt">
      <div class="search-prompt-quicklinks">
        <a href="products.html?type=saree">Sarees</a>
        <a href="products.html?type=suit">Suits</a>
        <a href="new-arrivals.html">New Arrivals</a>
        <a href="collections.html">Collections</a>
        <a href="sale.html">Sale</a>
      </div>
    </div>
    <div id="searchResults" class="results-grid"></div>
    <nav id="searchPager" class="search-pager" aria-label="Search results pages" hidden></nav>
    <div id="searchRecovery"></div>
  </div>

  </main>
  <div id="footer"></div>

  <script type="module">
    import { renderHeader, renderFooter, hydrateHeaderAuth } from "./assets/ui.js";
    import { searchProducts, renderSearchResults, SEARCH_PAGE_SIZE } from "./assets/search.js";
    import { errorStateHtml, logListingError } from "./assets/listing-ui.js";
    import { escapeHtml } from "./assets/safe.js";

    // Render header and footer
    document.getElementById("header").innerHTML = renderHeader();
    hydrateHeaderAuth();
    document.getElementById("footer").innerHTML = renderFooter();

    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');
    const searchStatus = document.getElementById('searchStatus');
    const searchPrompt = document.getElementById('searchPrompt');

    const searchPager = document.getElementById('searchPager');
    const searchRecovery = document.getElementById('searchRecovery');
    let debounceTimer;
    let currentPage = 1;
    let latestRequest = 0;

    // Get query from URL if present
    const urlParams = new URLSearchParams(window.location.search);
    const initialQuery = urlParams.get('q');
    if (initialQuery) {
      searchInput.value = initialQuery;
      searchPrompt.style.display = 'none';
      currentPage = Math.max(1, parseInt(urlParams.get('page') || '1', 10) || 1);
      performSearch(initialQuery, currentPage);
    }

    // Search when user types
    searchInput.addEventListener('input', (e) => {
      const query = e.target.value;

      // Update URL
      const url = new URL(window.location);
      url.searchParams.delete('page');
      if (query) {
        url.searchParams.set('q', query);
      } else {
        url.searchParams.delete('q');
      }
      window.history.replaceState({}, '', url);

      // Debounce search
      clearTimeout(debounceTimer);

      if (query.trim().length < 2) {
        searchResults.innerHTML = '';
        searchStatus.textContent = '';
        searchPager.hidden = true;
        searchRecovery.innerHTML = '';
        searchPrompt.style.display = '';
        return;
      }

      searchPrompt.style.display = 'none';
      searchStatus.textContent = 'Searching...';

      debounceTimer = setTimeout(() => {
        currentPage = 1;
        performSearch(query, 1);
      }, 300);
    });

    function recoveryHtml(query) {
      return `<div class="search-recovery">
        <h2>No matches for "${escapeHtml(query)}"</h2>
        <p>Try a different word, or:</p>
        <div class="search-recovery-links">
          <a href="products.html?type=saree">View all sarees</a>
          <a href="search.html?q=chanderi+silk">Chanderi silk</a>
          <a href="sale.html">Sale</a>
          <a href="contact.html">Contact us</a>
        </div>
      </div>`;
    }

    function renderPager(query, page, total) {
      const pages = Math.ceil(total / SEARCH_PAGE_SIZE);
      if (pages <= 1) { searchPager.hidden = true; searchPager.innerHTML = ''; return; }
      searchPager.hidden = false;
      searchPager.innerHTML =
        `<button type="button" class="btn secondary" data-page="${page - 1}" ${page <= 1 ? 'disabled' : ''}>Previous</button>` +
        `<span class="search-pager-info">Page ${page} of ${pages}</span>` +
        `<button type="button" class="btn secondary" data-page="${page + 1}" ${page >= pages ? 'disabled' : ''}>Next</button>`;
    }

    searchPager.addEventListener('click', (e) => {
      const b = e.target.closest('button[data-page]');
      if (!b || b.disabled) return;
      const page = parseInt(b.dataset.page, 10);
      currentPage = page;
      const url = new URL(window.location);
      if (page > 1) url.searchParams.set('page', page); else url.searchParams.delete('page');
      window.history.replaceState({}, '', url);
      performSearch(searchInput.value, page, true);
    });

    async function performSearch(query, page = 1, scroll = false) {
      const reqId = ++latestRequest;
      try {
        const { data: products, total, error } = await searchProducts(query, {
          limit: SEARCH_PAGE_SIZE, offset: (page - 1) * SEARCH_PAGE_SIZE,
        });
        if (reqId !== latestRequest) return; // a newer search superseded this one

        searchRecovery.innerHTML = '';
        if (error) {
          logListingError('search', error);
          searchStatus.textContent = '';
          searchResults.innerHTML = '';
          searchPager.hidden = true;
          searchRecovery.innerHTML = errorStateHtml();
          window.announce?.("We couldn't load search results. Please try again.");
          return;
        }

        const q = query.trim();
        if (products.length > 0) {
          searchStatus.textContent = total + ' product' + (total === 1 ? '' : 's') + " found for '" + q + "'";
        } else {
          searchStatus.textContent = "No products found for '" + q + "'";
          searchRecovery.innerHTML = recoveryHtml(q);
        }
        window.announce?.(searchStatus.textContent);
        searchResults.innerHTML = renderSearchResults(products);
        renderPager(query, page, total);
        if (scroll) searchStatus.scrollIntoView({ behavior: 'smooth', block: 'start' });

      } catch (err) {
        logListingError('search', err);
        searchStatus.textContent = '';
        searchRecovery.innerHTML = errorStateHtml();
      }
    }
  </script>
</body>
</html>
