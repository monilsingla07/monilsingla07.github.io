  <meta charset="utf-8" />

  <title>Admin Orders — AhamStree</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">

  <style>
    .sbadge { display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800;gap:4px; }
    .sbadge.cod_pending  { background:#fff7ed;color:#9a3412;border:1px solid #fed7aa; }
    .sbadge.confirmed    { background:#dcfce7;color:#166534; }
    .sbadge.paid         { background:#dcfce7;color:#166534; }
    .sbadge.shipped      { background:#dbeafe;color:#1e40af; }
    .sbadge.delivered    { background:#f0fdf4;color:#14532d;border:1px solid #86efac; }
    .sbadge.pending      { background:#fef9c3;color:#854d0e; }
    .sbadge.failed       { background:#fee2e2;color:#991b1b; }
    .sbadge.cancelled    { background:#f3f4f6;color:#6b7280; }
    .sbadge.refunded     { background:#f5f3ff;color:#5b21b6; }

    .pm-pill { display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700; }
    .pm-pill.cod    { background:#fff7ed;color:#9a3412; }
    .pm-pill.online { background:#eff6ff;color:#1d4ed8; }

    .action-bar { padding:12px 16px;border-top:1px solid var(--border-light,#f3f4f6); }
    .action-bar.cod-confirm { background:#fff7ed;border-top-color:#fed7aa; }
    .action-bar.ship-bar    { background:#f0f9ff;border-top-color:#bae6fd; }

    .awb-row { display:flex;gap:8px;align-items:center;margin-top:8px; }
    .awb-row input { flex:1;min-width:0; }

    #toast {
      position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
      background:#111;color:#fff;padding:10px 20px;border-radius:12px;font-size:13px;
      font-weight:700;opacity:0;transition:all .25s ease;pointer-events:none;z-index:9999;
      white-space:nowrap;
    }
    #toast.show { opacity:1;transform:translateX(-50%) translateY(0); }

    .status-row { display:flex;gap:8px;align-items:center;flex-wrap:wrap; }
    .order-card { border-radius:16px;overflow:hidden;border:1px solid var(--border,#e5e7eb);background:#fff; }
    .order-card + .order-card { margin-top:0; }

    .filters-bar { display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center; }
    .filters-bar .input { height:40px;font-size:13px; }

    .section-lbl { font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.5;margin-bottom:4px; }

    .pager { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:14px; justify-content:space-between; }
    .pager .small { opacity:.7; }
  </style>
</head>

<body>
  <div id="header"></div>

  <div class="container" style="max-width:1000px;">
    <div id="loadingState" style="text-align:center;padding:48px;opacity:.6;font-size:14px;">Verifying admin access…</div>

    <div id="mainContent" style="display:none;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:18px;">
        <div>
          <h2 style="margin:0;">Admin — Orders</h2>
          <div class="small" style="opacity:.65;margin-top:4px;">Manage all orders. Status updates are reflected on the customer's orders page immediately.</div>
        </div>
        <a class="btn secondary" href="admin.html" style="padding:8px 14px;font-size:13px;">← Dashboard</a>
      </div>

      <div class="filters-bar">
        <select id="statusFilter" class="input" style="max-width:260px;">
          <option value="">All statuses</option>
          <option value="cod_pending">COD Pending (confirm first)</option>
          <option value="confirmed">COD Confirmed (ship now)</option>
          <option value="paid">Paid Online (ship now)</option>
          <option value="payment_pending_all">Payment pending (all)</option>
          <option value="payment_link_created">Payment link created</option>
          <option value="shipped">Shipped</option>
          <option value="delivered">Delivered</option>
          <option value="failed">Failed / Expired</option>
          <option value="cancelled">Cancelled</option>
        </select>

        <select id="methodFilter" class="input" style="max-width:180px;">
          <option value="">All payment types</option>
          <option value="razorpay">Online (Razorpay)</option>
          <option value="manual">Manual / In-store</option>
          <option value="cod">Cash on Delivery</option>
        </select>

        <input id="search" class="input" placeholder="Search phone or order ID…" style="max-width:260px;" />
        <button id="btnLoad" class="btn" style="padding:8px 16px;font-size:13px;">Refresh</button>
        <button id="btnExportCsv" class="btn secondary" style="padding:8px 16px;font-size:13px;">Export CSV</button>
      </div>

      <!-- Bulk-confirm COD orders — the one bulk action safe to automate
           without any per-order judgment call (unlike shipping, which needs
           a courier picked per order's serviceability/rate, this is a pure
           status flip). Only ever shows checkboxes on orders actually in
           cod_pending, so there's no risk of bulk-touching an order in some
           other state. -->
      <div id="bulkOrdersBar" style="display:none; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 14px; border-radius:12px; background:#fffbeb; border:1.5px solid #fde68a; margin-bottom:12px;">
        <strong id="bulkOrdersCount" style="font-size:13px; color:#92400e;"></strong>
        <button id="bulkConfirmCod" class="btn secondary" style="padding:6px 12px; font-size:12px;">Confirm selected COD orders</button>
        <button id="bulkOrdersClear" class="btn secondary" style="padding:6px 12px; font-size:12px; margin-left:auto;">Clear selection</button>
      </div>

      <div id="statusMsg" class="small" style="margin-bottom:12px;opacity:.6;"></div>
      <div id="list" style="display:grid;gap:14px;"></div>

      <div class="pager">
        <div class="small" id="pagerInfo"></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button id="btnPrev" class="btn secondary" style="padding:8px 14px;font-size:13px;">← Prev</button>
          <button id="btnNext" class="btn secondary" style="padding:8px 14px;font-size:13px;">Next →</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast"></div>
  <div id="footer"></div>

  <script type="module">
    import { renderHeader, renderFooter, hydrateHeaderAuth } from "./assets/ui.js";
    import { supabase } from "./assets/supabase.js";
    import { escapeHtml, escapeAttr, safeHref, safeUrl } from "./assets/safe.js";

    document.getElementById("header").innerHTML = renderHeader("admin");
    document.getElementById("footer").innerHTML = renderFooter();
    hydrateHeaderAuth();

    var loadingState = document.getElementById("loadingState");
    var mainContent  = document.getElementById("mainContent");
    var statusMsg    = document.getElementById("statusMsg");
    var list         = document.getElementById("list");
    var pagerInfo    = document.getElementById("pagerInfo");
    var btnPrev      = document.getElementById("btnPrev");
    var btnNext      = document.getElementById("btnNext");

    // Pagination state
    let page = 1;
    const limit = 50;
    let lastTotal = 0;
    let lastShown = 0;
    let currentOrders = [];
    const selectedOrderIds = new Set();

    function showAdminError(emoji, title, message) {
      loadingState.style.display = "block";
      mainContent.style.display = "none";
      loadingState.innerHTML =
        '<div style="min-height:50vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;">' +
          '<div style="font-size:48px;">' + emoji + '</div>' +
          '<h3 style="margin:0;">' + title + '</h3>' +
          '<div class="small" style="opacity:.7;">' + message + '</div>' +
          '<a class="btn secondary" href="index.html" style="margin-top:8px;">Go to store</a>' +
        '</div>';
    }

    async function initAdmin() {
      try {
        var sessResult = await supabase.auth.getSession();
        if (sessResult.error) { showAdminError("⚠️", "Auth Error", sessResult.error.message); return; }
        if (!sessResult.data || !sessResult.data.session) { window.location.href = "login.html"; return; }

        loadingState.style.display = "none";
        mainContent.style.display  = "block";
        setupPage();
      } catch (e) {
        console.error("Admin page error:", e);
        showAdminError("⚠️", "Something went wrong", e.message || "An unexpected error occurred.");
      }
    }

    function setupPage() {

      async function callFn(name, body) {
        const { data, error } = await supabase.functions.invoke(name, { body: body || {} });

        if (error) {
          if (error.status === 401) {
            window.location.href = "login.html";
            return { ok: false, handled: true };
          }
          if (error.status === 403) {
            showAdminError("🔒", "Access Denied", "Your account does not have admin access.");
            return { ok: false, handled: true };
          }
          // supabase.functions.invoke() only puts a generic string on
          // error.message ("Edge Function returned a non-2xx status code")
          // — the actual reason our function gave (its `error`/`details`
          // JSON fields) lives in error.context, the raw Response, and has
          // to be parsed out explicitly or it's lost. Without this, every
          // failure here showed the same unhelpful generic text no matter
          // what actually went wrong (e.g. a real Shiprocket rejection
          // reason like a wallet-balance error).
          let msg = error.message || "Function error";
          try {
            if (error.context && typeof error.context.json === "function") {
              const body2 = await error.context.json();
              if (body2?.details) msg = body2.error ? `${body2.error} (${body2.details})` : String(body2.details);
              else if (body2?.error) msg = body2.error;
            }
          } catch (_) { /* keep the fallback message if the body can't be parsed */ }
          throw new Error(msg);
        }

        return { ok: true, data };
      }

      function money(v) {
        return "₹" + Number(v || 0).toLocaleString("en-IN", { maximumFractionDigits: 0 });
      }

      function toast(msg, color = "#111") {
        const el = document.getElementById("toast");
        el.textContent  = msg;
        el.style.background = color;
        el.classList.add("show");
        setTimeout(() => el.classList.remove("show"), 3500);
      }

      function statusBadge(st) {
        const map = {
          cod_pending:          { label: "💵 COD Pending",     cls: "cod_pending" },
          confirmed:            { label: "✅ COD Confirmed",   cls: "confirmed"   },
          paid:                 { label: "✅ Paid",            cls: "paid"        },
          payment_link_created: { label: "⏳ Payment pending", cls: "pending"     },
          payment_pending:      { label: "⏳ Payment pending", cls: "pending"     },
          created:              { label: "⏳ Payment pending", cls: "pending"     },
          payment_link_failed:  { label: "❌ Link failed",     cls: "failed"      },
          failed:               { label: "❌ Failed",          cls: "failed"      },
          expired:              { label: "❌ Expired",         cls: "failed"      },
          shipped:              { label: "🚚 Shipped",         cls: "shipped"     },
          delivered:            { label: "📬 Delivered",       cls: "delivered"   },
          cancelled:            { label: "🚫 Cancelled",       cls: "cancelled"   },
          refunded:             { label: "↩️ Refunded",        cls: "refunded"    },
        };
        const s = map[st] || { label: st || "Unknown", cls: "pending" };
        return `<span class="sbadge ${s.cls}">${s.label}</span>`;
      }

      const MANUAL_VIA_LABEL = { cash: "💵 Cash", card: "💳 Card", upi: "📱 UPI", other: "🏪 In-store" };

      function paymentPill(method, receivedVia) {
        if (method === "cod") return `<span class="pm-pill cod">💵 COD</span>`;
        if (method === "manual") {
          const label = MANUAL_VIA_LABEL[receivedVia] || "🏪 In-store";
          return `<span class="pm-pill cod">${label}</span>`;
        }
        return `<span class="pm-pill online">💳 Online</span>`;
      }

      function waLink(phone, text) {
        const p    = String(phone || "").replace(/\D/g, "");
        const full = p.length === 10 ? "91" + p : p;
        return `https://wa.me/${full}?text=${encodeURIComponent(text)}`;
      }

      // Renders the "Customer / Ship to / Items" block. Extracted so both
      // the normal card render and the Cancel button on the edit form can
      // produce the exact same markup without duplicating it.
      function orderDetailsHtml(o) {
        const addr = o.shipping_address;
        const addrText = addr
          ? [addr.full_name, addr.address_line1, addr.address_line2, addr.city, addr.state, addr.pincode].filter(Boolean).join(", ")
          : "—";
        const itemsHtml = (o.order_items || []).map(it =>
          `<div style="display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid #f3f4f6;">
             <span class="small">${Number(it.qty)}× ${escapeHtml(it.title)}</span>
             <span class="small" style="font-weight:700;white-space:nowrap;">${money(it.price_inr)}</span>
           </div>`
        ).join("");

        return `
          <div class="order-details" data-details="${escapeAttr(o.id)}">
            <div style="padding:0 16px 12px;display:grid;grid-template-columns:1fr 1fr;gap:12px;">
              <div>
                <div class="section-lbl">Customer</div>
                <div style="font-weight:700;">${escapeHtml(o.customer_name || "—")}</div>
                <div class="small">${escapeHtml(o.customer_phone || "—")}</div>
                ${o.customer_email ? `<div class="small" style="opacity:.6;">${escapeHtml(o.customer_email)}</div>` : ""}
              </div>
              <div>
                <div class="section-lbl">Ship to</div>
                <div class="small" style="line-height:1.5;">${escapeHtml(addrText)}</div>
              </div>
            </div>

            <div style="padding:0 16px 10px;">
              <div class="section-lbl">Items</div>
              ${itemsHtml || `<div class="small" style="opacity:.5;">No items recorded.</div>`}
            </div>
          </div>`;
      }

      // Inline edit form, swapped in over orderDetailsHtml() for an
      // admin-created order. Item qty/price editing is only offered when
      // the order has no catalog product_id line items — see
      // admin-edit-order for why.
      function renderEditForm(o) {
        const addr = o.shipping_address || {};
        const isShipping = o.order_type === "shipping";
        const items = o.order_items || [];
        const hasCatalogItems = items.some(it => it.product_id != null);

        const itemRowHtml = (it) => `
          <div class="edit-item-row" style="display:flex;gap:6px;align-items:center;margin-bottom:6px;">
            <input class="input edit-item-title" value="${escapeAttr(it.title || "")}" placeholder="Item description" style="flex:2;font-size:13px;padding:6px 8px;" ${hasCatalogItems ? "readonly" : ""} />
            <input class="input edit-item-qty" type="number" min="1" value="${Number(it.qty || 1)}" style="width:64px;font-size:13px;padding:6px 8px;" ${hasCatalogItems ? "readonly" : ""} />
            <input class="input edit-item-price" type="number" min="0" value="${Number(it.price_inr || 0)}" style="width:96px;font-size:13px;padding:6px 8px;" ${hasCatalogItems ? "readonly" : ""} />
            ${hasCatalogItems ? "" : `<button type="button" class="btn secondary" data-role="remove-item" style="padding:6px 10px;font-size:12px;">✕</button>`}
          </div>`;

        const itemRows = items.map(itemRowHtml).join("");

        return `
          <div class="order-details order-edit-form" data-details="${escapeAttr(o.id)}" style="padding:12px 16px;background:#fafafa;border-top:1px solid #f3f4f6;border-bottom:1px solid #f3f4f6;">
            <div class="section-lbl" style="margin-bottom:8px;">Edit order</div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;">
              <label class="small">Name
                <input class="input edit-name" value="${escapeAttr(o.customer_name || "")}" style="width:100%;font-size:13px;padding:7px 9px;margin-top:3px;" />
              </label>
              <label class="small">Phone
                <input class="input edit-phone" value="${escapeAttr(o.customer_phone || "")}" style="width:100%;font-size:13px;padding:7px 9px;margin-top:3px;" />
              </label>
            </div>
            <label class="small" style="display:block;margin-bottom:10px;">Email
              <input class="input edit-email" value="${escapeAttr(o.customer_email || "")}" style="width:100%;font-size:13px;padding:7px 9px;margin-top:3px;" />
            </label>

            ${isShipping ? `
            <div class="section-lbl" style="margin-bottom:6px;">Ship to</div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;">
              <input class="input edit-addr-line1" placeholder="Address line 1" value="${escapeAttr(addr.address_line1 || "")}" style="font-size:13px;padding:7px 9px;" />
              <input class="input edit-addr-line2" placeholder="Address line 2 (optional)" value="${escapeAttr(addr.address_line2 || "")}" style="font-size:13px;padding:7px 9px;" />
              <input class="input edit-addr-city" placeholder="City" value="${escapeAttr(addr.city || "")}" style="font-size:13px;padding:7px 9px;" />
              <input class="input edit-addr-state" placeholder="State" value="${escapeAttr(addr.state || "")}" style="font-size:13px;padding:7px 9px;" />
              <input class="input edit-addr-pincode" placeholder="Pincode" value="${escapeAttr(addr.pincode || "")}" style="font-size:13px;padding:7px 9px;" />
            </div>` : ""}

            <div class="section-lbl" style="margin-bottom:6px;">Items</div>
            ${hasCatalogItems ? `<div class="small" style="opacity:.6;margin-bottom:8px;">This order has catalog inventory items — quantities/prices can't be edited here yet. Customer and address changes above still apply.</div>` : ""}
            <div class="edit-items-list">${itemRows}</div>
            ${hasCatalogItems ? "" : `<button type="button" class="btn secondary" data-role="add-item" style="padding:6px 12px;font-size:12px;margin-top:2px;">+ Add item</button>`}

            <div style="display:flex;gap:8px;margin-top:14px;">
              <button type="button" class="btn" data-role="save-edit" style="padding:9px 16px;font-size:13px;">Save changes</button>
              <button type="button" class="btn secondary" data-role="cancel-edit" style="padding:9px 16px;font-size:13px;">Cancel</button>
            </div>
          </div>`;
      }

      function wireEditForm(order) {
        const form = document.querySelector(`.order-edit-form[data-details="${order.id}"]`);
        if (!form) return;

        const itemsList = form.querySelector(".edit-items-list");

        form.querySelectorAll("[data-role='remove-item']").forEach(b => {
          b.addEventListener("click", () => b.closest(".edit-item-row").remove());
        });

        const addBtn = form.querySelector("[data-role='add-item']");
        if (addBtn) {
          addBtn.addEventListener("click", () => {
            const row = document.createElement("div");
            row.className = "edit-item-row";
            row.style.cssText = "display:flex;gap:6px;align-items:center;margin-bottom:6px;";
            row.innerHTML = `
              <input class="input edit-item-title" placeholder="Item description" style="flex:2;font-size:13px;padding:6px 8px;" />
              <input class="input edit-item-qty" type="number" min="1" value="1" style="width:64px;font-size:13px;padding:6px 8px;" />
              <input class="input edit-item-price" type="number" min="0" value="0" style="width:96px;font-size:13px;padding:6px 8px;" />
              <button type="button" class="btn secondary" data-role="remove-item" style="padding:6px 10px;font-size:12px;">✕</button>`;
            row.querySelector("[data-role='remove-item']").addEventListener("click", () => row.remove());
            itemsList.appendChild(row);
          });
        }

        form.querySelector("[data-role='cancel-edit']").addEventListener("click", () => {
          form.outerHTML = orderDetailsHtml(order);
        });

        form.querySelector("[data-role='save-edit']").addEventListener("click", async () => {
          const saveBtn = form.querySelector("[data-role='save-edit']");
          const cancelBtn = form.querySelector("[data-role='cancel-edit']");
          saveBtn.disabled = true;
          cancelBtn.disabled = true;
          saveBtn.textContent = "Saving…";

          const payload = {
            order_id: order.id,
            customer_name: form.querySelector(".edit-name").value.trim(),
            customer_phone: form.querySelector(".edit-phone").value.trim(),
            customer_email: form.querySelector(".edit-email").value.trim(),
          };

          if (order.order_type === "shipping") {
            payload.shipping_address = {
              full_name: payload.customer_name,
              address_line1: form.querySelector(".edit-addr-line1")?.value.trim() || "",
              address_line2: form.querySelector(".edit-addr-line2")?.value.trim() || "",
              city: form.querySelector(".edit-addr-city")?.value.trim() || "",
              state: form.querySelector(".edit-addr-state")?.value.trim() || "",
              pincode: form.querySelector(".edit-addr-pincode")?.value.trim() || "",
            };
          }

          const hasCatalogItems = (order.order_items || []).some(it => it.product_id != null);
          if (!hasCatalogItems) {
            const rows = [...itemsList.querySelectorAll(".edit-item-row")];
            const items = rows.map(row => ({
              title: row.querySelector(".edit-item-title").value.trim(),
              qty: Number(row.querySelector(".edit-item-qty").value || 0),
              price_inr: Number(row.querySelector(".edit-item-price").value || 0),
            })).filter(it => it.title);
            if (!items.length) {
              toast("Add at least one item", "#dc2626");
              saveBtn.disabled = false; cancelBtn.disabled = false; saveBtn.textContent = "Save changes";
              return;
            }
            payload.items = items;
          }

          try {
            const r = await callFn("admin-edit-order", payload);
            if (!r.ok) { if (!r.handled) throw new Error("Save failed"); return; }
            toast("Order updated ✅", "#166534");
            load();
          } catch (e) {
            toast("Error: " + e.message, "#dc2626");
            saveBtn.disabled = false;
            cancelBtn.disabled = false;
            saveBtn.textContent = "Save changes";
          }
        });
      }

      function renderOrder(o) {
        const isCod         = o.payment_method === "cod";
        const isManual      = o.payment_method === "manual";
        const isOnline      = o.payment_method === "razorpay";
        const shortId       = (o.id || "").slice(0, 8).toUpperCase();
        const phone         = o.customer_phone || "";

        const isCodPending  = o.status === "cod_pending";
        const needsShipping = ["confirmed", "paid"].includes(o.status) && !o.shiprocket_awb;
        const isShipped     = ["shipped", "delivered"].includes(o.status) || !!o.shiprocket_awb;

        const canRegen      = isOnline && ["payment_link_created", "payment_link_failed", "created", "failed", "payment_pending"].includes(o.status);
        const payHref       = o.razorpay_payment_link_url ? safeHref(o.razorpay_payment_link_url) : "";

        // Admin-created orders (order_type set by admin-create-order.html —
        // customer checkout never sets this) can be edited/deleted here.
        // Editing is further blocked once the order has actually shipped or
        // landed in a terminal status — matches admin-edit-order's own guard.
        const isAdminCreated = !!o.order_type;
        const isEditable     = isAdminCreated && !o.shiprocket_awb &&
          ["paid", "confirmed", "payment_link_created", "cod_pending"].includes(o.status);

        const siteRoot      = window.location.origin;
        const confirmMsg    = `Hi ${o.customer_name || "there"}, your AhamStree Cash on Delivery order #${shortId} is confirmed! Total: ${money(o.total_inr)}. We'll dispatch it soon. 🙏`;
        const shippedMsg    = `Hi ${o.customer_name || "there"}, your AhamStree order #${shortId} has been shipped! 🎉 Track here: ${siteRoot}/track.html?awb=${encodeURIComponent(o.shiprocket_awb || "")}`;
        const reminderMsg   = `Hi ${o.customer_name || "there"}, your AhamStree order #${shortId} payment is pending. Complete it here: ${o.razorpay_payment_link_url || ""}`;

        const discountRow = Number(o.discount_inr) > 0
          ? `<div style="display:flex;justify-content:space-between;gap:8px;margin-top:4px;">
               <span class="small" style="opacity:.7;">Discount</span>
               <span class="small" style="color:green;font-weight:700;">−${money(o.discount_inr)}</span>
             </div>` : "";

        return `
          <div class="order-card" data-order-id="${escapeAttr(o.id)}">

            <div style="padding:14px 16px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;">
              <div>
                <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;">
                  ${isCodPending ? `<input type="checkbox" class="order-select" data-select-cod="${escapeAttr(o.id)}" ${selectedOrderIds.has(o.id) ? "checked" : ""} title="Select for bulk confirm" style="width:16px;height:16px;" />` : ""}
                  <span style="font-weight:900;font-size:15px;">Order #${shortId}</span>
                  ${statusBadge(o.status)}
                  ${paymentPill(o.payment_method, o.payment_received_via)}
                  ${isCodPending  ? `<span style="background:#fef3c7;color:#b45309;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;">⚠ Needs confirmation</span>` : ""}
                  ${needsShipping ? `<span style="background:#dbeafe;color:#1e40af;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;">📦 Ready to ship</span>` : ""}
                </div>
                <div class="small" style="opacity:.6;">${new Date(o.created_at).toLocaleString("en-IN", { day:"numeric", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" })}</div>
              </div>

              <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
                ${payHref ? `<a class="btn secondary" style="padding:7px 12px;font-size:12px;" href="${payHref}" target="_blank" rel="noopener noreferrer">View payment link</a>` : ""}
                ${canRegen ? `<button class="btn secondary" style="padding:7px 12px;font-size:12px;" data-action="regen" data-id="${escapeAttr(o.id)}">Regenerate link</button>` : ""}
                <button class="btn secondary" style="padding:7px 12px;font-size:12px;" data-action="invoice" data-id="${escapeAttr(o.id)}">Generate invoice</button>
                ${isEditable ? `<button class="btn secondary" style="padding:7px 12px;font-size:12px;" data-action="edit-order" data-id="${escapeAttr(o.id)}">✏️ Edit</button>` : ""}
                <button class="btn secondary" style="padding:7px 12px;font-size:12px;color:crimson;border-color:crimson;" data-action="delete-order" data-id="${escapeAttr(o.id)}">🗑 Delete</button>
              </div>
            </div>

            ${orderDetailsHtml(o)}

            <div style="padding:10px 16px;border-top:1px solid #f3f4f6;background:#fafafa;font-size:13px;">
              ${discountRow}
              <div style="display:flex;justify-content:space-between;gap:8px;margin-top:4px;">
                <span style="opacity:.7;">Shipping</span><span>${money(o.shipping_inr)}</span>
              </div>
              <div style="display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-weight:900;">
                <span>Total</span><span>${money(o.total_inr)}</span>
              </div>
            </div>

            ${isCodPending ? `
            <div class="action-bar cod-confirm">
              <div style="font-weight:800;font-size:13px;margin-bottom:6px;">💵 Confirm this COD order</div>
              <div class="small" style="color:#92400e;margin-bottom:10px;">
                Confirm you've spoken to the customer and the order is valid. This changes status to "Confirmed".
              </div>
              <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <button class="btn" style="padding:9px 16px;font-size:13px;" data-action="confirm-cod" data-id="${escapeAttr(o.id)}">
                  ✅ Confirm COD order
                </button>
                <button class="btn secondary" style="padding:9px 16px;font-size:13px;color:crimson;border-color:crimson;" data-action="update-status" data-id="${escapeAttr(o.id)}" data-status="cancelled">
                  Cancel order
                </button>
              </div>
            </div>` : ""}

            ${needsShipping ? `
            <div class="action-bar ship-bar">
              <div style="font-weight:800;font-size:13px;margin-bottom:6px;">📦 Ship this order</div>
              <div class="small" style="color:#1e40af;margin-bottom:10px;">
                Pick a courier, then confirm — this creates the Shiprocket shipment, assigns that courier's AWB, and requests pickup.
              </div>
              <div class="ship-slot" data-slot-id="${escapeAttr(o.id)}" style="margin-bottom:12px;">
                <button class="btn" style="padding:10px 16px;font-size:13px;white-space:nowrap;"
                        data-action="ship-options" data-id="${escapeAttr(o.id)}">
                  🚀 Ship Now — choose courier
                </button>
              </div>
              <div class="small" style="color:#64748b;margin:2px 0 6px;">— or, if you already shipped it directly in Shiprocket —</div>
              <div class="awb-row">
                <input class="input awb-input" placeholder="Shiprocket AWB number"
                      data-id="${escapeAttr(o.id)}" style="font-size:13px;" />
                <button class="btn secondary" style="padding:10px 16px;font-size:13px;white-space:nowrap;"
                        data-action="ship" data-id="${escapeAttr(o.id)}">
                  Mark shipped →
                </button>
              </div>
              <div class="small" style="color:#64748b;margin:10px 0 6px;">— or, if you're delivering this in person (no courier) —</div>
              <button class="btn secondary" style="padding:9px 16px;font-size:13px;"
                      data-action="update-status" data-id="${escapeAttr(o.id)}" data-status="delivered">
                ✅ Mark delivered (self / in-person)
              </button>
            </div>` : ""}

            ${isShipped && o.shiprocket_awb ? `
            <div style="padding:10px 16px;background:#eff6ff;border-top:1px solid #bfdbfe;">
              <div class="small" style="color:#1e40af;">
                🚚 AWB: <strong>${escapeHtml(o.shiprocket_awb)}</strong>
                &nbsp;•&nbsp;
                <a href="track.html?awb=${encodeURIComponent(o.shiprocket_awb)}" target="_blank" style="color:inherit;font-weight:700;">View tracking →</a>
              </div>
            </div>` : ""}

            ${o.status === "shipped" ? `
            <div class="action-bar">
              <div class="section-lbl" style="margin-bottom:8px;">Update status</div>
              <div class="status-row">
                <button class="btn secondary" style="padding:7px 12px;font-size:12px;" data-action="update-status" data-id="${escapeAttr(o.id)}" data-status="delivered">
                  ✅ Mark delivered
                </button>
                <button class="btn secondary" style="padding:7px 12px;font-size:12px;color:crimson;border-color:crimson;" data-action="update-status" data-id="${escapeAttr(o.id)}" data-status="cancelled">
                  Cancel order
                </button>
              </div>
            </div>` : ""}

            ${o.status === "confirmed" ? `
            <div class="action-bar">
              <div class="status-row">
                <button class="btn secondary" style="padding:7px 12px;font-size:12px;color:crimson;border-color:crimson;" data-action="update-status" data-id="${escapeAttr(o.id)}" data-status="cancelled">
                  Cancel order
                </button>
              </div>
            </div>` : ""}

            ${phone ? `
            <div style="padding:10px 16px;border-top:1px solid #f3f4f6;display:flex;gap:8px;flex-wrap:wrap;">
              <div class="section-lbl" style="width:100%;margin-bottom:2px;">WhatsApp</div>
              ${isCod ? `<a class="btn secondary" style="padding:7px 12px;font-size:12px;" href="${safeHref(waLink(phone, confirmMsg))}" target="_blank" rel="noopener noreferrer">✅ Confirm COD</a>` : ""}
              ${o.shiprocket_awb ? `<a class="btn secondary" style="padding:7px 12px;font-size:12px;" href="${safeHref(waLink(phone, shippedMsg))}" target="_blank" rel="noopener noreferrer">🚚 Share tracking</a>` : ""}
              ${isOnline && canRegen ? `<a class="btn secondary" style="padding:7px 12px;font-size:12px;" href="${safeHref(waLink(phone, reminderMsg))}" target="_blank" rel="noopener noreferrer">🔔 Payment reminder</a>` : ""}
              <a class="btn secondary" data-wa-invoice href="#" style="padding:7px 12px;font-size:12px;opacity:.5;" data-phone="${escapeAttr(phone)}" data-id="${escapeAttr(o.id)}">📄 Send invoice</a>
            </div>` : ""}

          </div>
        `;
      }

      async function load(opts = {}) {
        const reset = !!opts.reset;
        if (reset) page = 1;

        statusMsg.textContent = "Loading…";
        list.innerHTML = "";

        const st     = document.getElementById("statusFilter").value;
        const method = document.getElementById("methodFilter").value;
        const q      = document.getElementById("search").value.trim();

        // Special client-side filter for "payment_pending_all"
        let statusToSend = st || null;
        if (st === "payment_pending_all") statusToSend = null;

        let r;
        try {
          r = await callFn("admin-orders", { status: statusToSend, q: q || null, page, limit });
          if (!r.ok) return;
        } catch (e) {
          statusMsg.textContent = "Error loading orders: " + e.message;
          pagerInfo.textContent = "";
          return;
        }

        let orders = r.data?.orders || [];

        // Apply "payment pending (all)" filter client-side
        if (st === "payment_pending_all") {
          orders = orders.filter(o => ["payment_link_created", "payment_pending", "created"].includes(o.status));
        }

        // Apply payment method filter client-side
        if (method) orders = orders.filter(o => (o.payment_method || "razorpay") === method);

        lastTotal = Number(r.data?.total || orders.length);
        lastShown = orders.length;

        statusMsg.textContent = orders.length
          ? `Showing ${orders.length} order${orders.length !== 1 ? "s" : ""}`
          : "No orders found.";

        // Pager info + enable/disable buttons
        const start = (page - 1) * limit + 1;
        const end = (page - 1) * limit + orders.length;
        pagerInfo.textContent = orders.length ? `Page ${page} • Showing ${start}-${end} of ${lastTotal}` : "";

        btnPrev.disabled = page <= 1;
        // If we got less than limit items, likely last page
        btnNext.disabled = orders.length < limit;

        currentOrders = orders;
        list.innerHTML = orders.map(renderOrder).join("");
        wireEvents();
      }

      async function updateStatus(orderId, newStatus, extra = {}) {
        const r = await callFn("admin-update-order-status", { order_id: orderId, status: newStatus, ...extra });
        if (!r.ok) throw new Error("Update failed");
        return r.data;
      }

      // ── Courier picker for "Ship Now" ──────────────────────────────────
      function wireShipOptionsButton(btn) {
        if (!btn) return;
        btn.addEventListener("click", async () => {
          const id = btn.dataset.id;
          const slot = btn.closest(".ship-slot");
          btn.disabled = true;
          const oldText = btn.textContent;
          btn.textContent = "Loading couriers…";
          try {
            const r = await callFn("admin-create-shipment", { order_id: id, action: "get_options" });
            if (!r.ok) { if (!r.handled) throw new Error("Could not load couriers"); return; }
            const couriers = r.data?.couriers || [];
            if (!couriers.length) throw new Error("No couriers available for this pincode");
            renderCourierPicker(slot, id, couriers, r.data?.computed_weight_kg);
          } catch (e) {
            toast("Error: " + e.message, "#dc2626");
            btn.disabled = false;
            btn.textContent = oldText;
          }
        });
      }

      function renderShipButton(slot, orderId) {
        slot.innerHTML = `
          <button class="btn" style="padding:10px 16px;font-size:13px;white-space:nowrap;"
                  data-action="ship-options" data-id="${escapeAttr(orderId)}">
            🚀 Ship Now — choose courier
          </button>`;
        wireShipOptionsButton(slot.querySelector("button[data-action='ship-options']"));
      }

      function renderCourierPicker(slot, orderId, couriers, weightKg) {
        const rows = couriers.map((c, i) => `
          <label style="display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid ${i === 0 ? "#93c5fd" : "#e5e7eb"};border-radius:8px;margin-bottom:6px;cursor:pointer;background:#fff;">
            <input type="radio" name="courier-choice" value="${escapeAttr(String(c.courier_id))}" ${i === 0 ? "checked" : ""} style="margin:0;flex-shrink:0;" />
            <span style="flex:1;font-size:13px;">
              <strong>${escapeHtml(c.courier_name || "Courier")}</strong>
              ${c.is_recommended ? `<span style="margin-left:6px;font-size:11px;font-weight:800;color:#166534;">★ Recommended</span>` : ""}
              <br><span style="color:#64748b;font-size:12px;">₹${Number(c.rate || 0).toFixed(2)}${c.etd_days ? ` • Est. ${escapeHtml(String(c.etd_days))}` : ""}</span>
            </span>
          </label>`).join("");

        const weightNote = weightKg != null
          ? `<div style="font-size:11px;color:#64748b;margin-bottom:8px;">Rates based on ${Number(weightKg).toFixed(2)} kg chargeable weight (packed product weight vs. box size, whichever is higher)</div>`
          : "";

        slot.innerHTML = `
          <div style="border:1px solid #bae6fd;border-radius:10px;padding:10px;background:#f8fbff;">
            <div style="font-weight:700;font-size:12px;margin-bottom:8px;color:#1e40af;">Choose a courier</div>
            ${weightNote}
            ${rows}
            <div style="display:flex;gap:8px;margin-top:10px;">
              <button class="btn" data-role="confirm-ship" style="padding:8px 14px;font-size:13px;">Confirm & Ship</button>
              <button class="btn secondary" data-role="cancel-ship" style="padding:8px 14px;font-size:13px;">Cancel</button>
            </div>
          </div>`;

        slot.querySelector("[data-role='cancel-ship']").addEventListener("click", () => {
          renderShipButton(slot, orderId);
        });

        slot.querySelector("[data-role='confirm-ship']").addEventListener("click", async (evt) => {
          const confirmBtn = evt.currentTarget;
          const cancelBtn = slot.querySelector("[data-role='cancel-ship']");
          const chosen = slot.querySelector("input[type='radio']:checked");
          const courierId = chosen ? chosen.value : null;
          const courierName = chosen ? (couriers.find(c => String(c.courier_id) === courierId)?.courier_name) : null;
          if (!confirm(`Ship order ${orderId.slice(0,8).toUpperCase()} via ${courierName || "the selected courier"} now?\n\nThis creates a real shipment and requests courier pickup.`)) return;

          confirmBtn.disabled = true;
          cancelBtn.disabled = true;
          confirmBtn.textContent = "Creating shipment…";
          try {
            const fallbackCourierIds = courierId
              ? couriers.filter(c => String(c.courier_id) !== courierId).map(c => c.courier_id)
              : [];
            const r = await callFn("admin-create-shipment", { order_id: orderId, courier_id: courierId, fallback_courier_ids: fallbackCourierIds });
            if (!r.ok) { if (!r.handled) throw new Error("Shipment creation failed"); return; }
            const awb = r.data?.awb;
            const courier = r.data?.courier ? ` via ${r.data.courier}` : "";
            const switched = r.data?.courier_switched ? " (auto-switched courier after a failed attempt)" : "";
            toast(`Shipped 🚚 AWB ${awb}${courier}${switched}`, "#166534");
            load();
          } catch (e) {
            toast("Ship error: " + e.message, "#dc2626");
            confirmBtn.disabled = false;
            cancelBtn.disabled = false;
            confirmBtn.textContent = "Confirm & Ship";
          }
        });
      }

      function wireEvents() {
        // Bulk-select checkboxes (COD-pending orders only)
        list.querySelectorAll("input[data-select-cod]").forEach(chk => {
          chk.addEventListener("change", () => {
            const id = chk.dataset.selectCod;
            if (chk.checked) selectedOrderIds.add(id); else selectedOrderIds.delete(id);
            renderBulkOrdersBar();
          });
        });

        // Confirm COD
        list.querySelectorAll("button[data-action='confirm-cod']").forEach(btn => {
          btn.addEventListener("click", async () => {
            const id = btn.dataset.id;
            btn.disabled = true;
            const oldText = btn.textContent;
            btn.textContent = "Confirming…";
            try {
              await updateStatus(id, "confirmed");
              toast("COD order confirmed ✅", "#166534");
              load();
            } catch (e) {
              toast("Error: " + e.message, "#dc2626");
              btn.disabled = false;
            } finally {
              btn.textContent = oldText;
            }
          });
        });

        // Ship Now — choose courier: step 1 loads live courier options,
        // step 2 (after picking one) actually creates the shipment/AWB/pickup.
        list.querySelectorAll("button[data-action='ship-options']").forEach(wireShipOptionsButton);

        // Mark shipped
        list.querySelectorAll("button[data-action='ship']").forEach(btn => {
          btn.addEventListener("click", async () => {
            const id       = btn.dataset.id;
            const card     = btn.closest("[data-order-id]");
            const awbInput = card?.querySelector(".awb-input");
            const awb      = (awbInput?.value || "").trim();

            if (!awb) { toast("Please enter the AWB number first", "#dc2626"); return; }

            btn.disabled = true;
            const oldText = btn.textContent;
            btn.textContent = "Saving…";
            try {
              await updateStatus(id, "shipped", { shiprocket_awb: awb });
              toast("Order marked as shipped 🚚", "#166534");
              load();
            } catch (e) {
              toast("Error: " + e.message, "#dc2626");
              btn.disabled = false;
            } finally {
              btn.textContent = oldText;
            }
          });
        });

        // Generic status update (delivered/cancelled)
        list.querySelectorAll("button[data-action='update-status']").forEach(btn => {
          btn.addEventListener("click", async () => {
            const id        = btn.dataset.id;
            const newStatus = btn.dataset.status;
            const label     = newStatus === "cancelled" ? "Cancel" : `Mark as "${newStatus}"`;

            if (!confirm(`${label} order ${id.slice(0,8).toUpperCase()}?\n\nThis will update the customer's orders page immediately.`)) return;

            btn.disabled = true;
            const oldText = btn.textContent;
            btn.textContent = "Saving…";
            try {
              const result = await updateStatus(id, newStatus);
              const razorpay = result?.refund?.razorpay;
              const toastMsg =
                razorpay === "processed" ? `Order ${newStatus} ✅ — payment refunded via Razorpay` :
                razorpay === "failed"    ? `Order ${newStatus} ✅ — refund FAILED, check Razorpay dashboard` :
                `Order ${newStatus} ✅`;
              toast(toastMsg, razorpay === "failed" ? "#dc2626" : "#166534");
              load();
            } catch (e) {
              toast("Error: " + e.message, "#dc2626");
              btn.disabled = false;
            } finally {
              btn.textContent = oldText;
            }
          });
        });

        // Edit order (admin-created orders only — see isEditable)
        list.querySelectorAll("button[data-action='edit-order']").forEach(btn => {
          btn.addEventListener("click", () => {
            const id = btn.dataset.id;
            const order = currentOrders.find(o => o.id === id);
            if (!order) return;
            const target = list.querySelector(`.order-details[data-details="${id}"]`);
            if (!target) return;
            target.outerHTML = renderEditForm(order);
            wireEditForm(order);
          });
        });

        // Delete order (permanent — releases/restocks any held inventory first)
        list.querySelectorAll("button[data-action='delete-order']").forEach(btn => {
          btn.addEventListener("click", async () => {
            const id = btn.dataset.id;
            const order = currentOrders.find(o => o.id === id);
            const shortId = id.slice(0, 8).toUpperCase();
            const hasShipment = !!(order && (order.shiprocket_order_id || order.shiprocket_shipment_id));

            let msg = `Permanently delete order ${shortId} (${order?.customer_name || "customer"}, ${money(order?.total_inr)})?\n\nThis cannot be undone.`;
            if (hasShipment) {
              msg += `\n\n⚠ This order has a Shiprocket shipment. Deleting it here does NOT cancel or remove it on Shiprocket's side — handle that separately if needed.`;
            }
            if (!confirm(msg)) return;

            btn.disabled = true;
            const oldText = btn.textContent;
            btn.textContent = "Deleting…";
            try {
              const r = await callFn("admin-delete-order", { order_id: id });
              if (!r.ok) { if (!r.handled) throw new Error("Delete failed"); return; }
              toast("Order deleted 🗑", "#166534");
              load();
            } catch (e) {
              toast("Error: " + e.message, "#dc2626");
              btn.disabled = false;
              btn.textContent = oldText;
            }
          });
        });

        // Regenerate payment link
        list.querySelectorAll("button[data-action='regen']").forEach(btn => {
          btn.addEventListener("click", async () => {
            const id = btn.dataset.id;
            btn.disabled = true;
            const oldText = btn.textContent;
            btn.textContent = "Working…";

            try {
              const r = await callFn("admin-regenerate-payment-link", { order_id: id });
              if (!r.ok) return;
              toast("New payment link created ✅", "#166534");
              load();
            } catch (e) {
              toast("Error: " + e.message, "#dc2626");
            } finally {
              btn.disabled = false;
              btn.textContent = oldText;
            }
          });
        });

        // Generate invoice
        list.querySelectorAll("button[data-action='invoice']").forEach(btn => {
          btn.addEventListener("click", async () => {
            const id = btn.dataset.id;
            btn.disabled = true;
            const oldText = btn.textContent;
            btn.textContent = "Generating…";

            try {
              const r = await callFn("admin-generate-invoice", { order_id: id });
              if (!r.ok) return;

              const inv = r.data || {};
              const invUrl = safeUrl(inv.invoice_url, { type: "href" });
              if (!invUrl) { toast("Invalid invoice URL", "#dc2626"); return; }

              const w = window.open(invUrl, "_blank", "noopener,noreferrer");
              if (w) w.opener = null;

              // Activate WhatsApp "Send invoice" button with proper phone formatting
              const card  = list.querySelector(`[data-order-id="${id}"]`);
              const waBtn = card?.querySelector("a[data-wa-invoice]");
              if (waBtn) {
                const phone = waBtn.dataset.phone || "";
                const raw = String(phone).replace(/\D/g, "");
                const full = raw.length === 10 ? "91" + raw : raw;
                const msg   = `Hi, your AhamStree invoice is ready: ${inv.invoice_url}`;
                waBtn.href  = `https://wa.me/${full}?text=${encodeURIComponent(msg)}`;
                waBtn.style.opacity = "1";
              }

              toast("Invoice generated ✅", "#166534");
            } catch (e) {
              toast("Invoice error: " + e.message, "#dc2626");
            } finally {
              btn.disabled = false;
              btn.textContent = oldText;
            }
          });
        });
      }

      // Controls
      document.getElementById("btnLoad").onclick = () => load({ reset: true });
      document.getElementById("statusFilter").onchange = () => load({ reset: true });
      document.getElementById("methodFilter").onchange = () => load({ reset: true });

      // Enter key support in search
      document.getElementById("search").addEventListener("keydown", (e) => {
        if (e.key === "Enter") load({ reset: true });
      });

      // Debounced typing search (optional but nice)
      let searchTimer = null;
      document.getElementById("search").addEventListener("input", () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => load({ reset: true }), 350);
      });

      // Pagination buttons
      btnPrev.onclick = () => { if (page > 1) { page -= 1; load(); } };
      btnNext.onclick = () => { page += 1; load(); };

      // Support URL ?status=...
      var urlStatus = new URLSearchParams(window.location.search).get("status");
      if (urlStatus) {
        var sel = document.getElementById("statusFilter");
        if ([...sel.options].some(o => o.value === urlStatus)) sel.value = urlStatus;
      }

      // ── Bulk-confirm selected COD orders ──────────────────────────────
      function renderBulkOrdersBar() {
        const bar = document.getElementById("bulkOrdersBar");
        const n = selectedOrderIds.size;
        bar.style.display = n > 0 ? "flex" : "none";
        if (n > 0) document.getElementById("bulkOrdersCount").textContent = n + " COD order" + (n > 1 ? "s" : "") + " selected";
      }
      document.getElementById("bulkOrdersClear").onclick = () => {
        selectedOrderIds.clear();
        renderBulkOrdersBar();
        load();
      };
      document.getElementById("bulkConfirmCod").onclick = async () => {
        const ids = Array.from(selectedOrderIds);
        if (!ids.length) return;
        if (!confirm(`Confirm ${ids.length} selected COD order(s)?`)) return;
        const btn = document.getElementById("bulkConfirmCod");
        btn.disabled = true;
        let okCount = 0;
        for (const id of ids) {
          try { await updateStatus(id, "confirmed"); okCount++; } catch (_e) { /* keep going */ }
        }
        selectedOrderIds.clear();
        btn.disabled = false;
        toast(`${okCount} of ${ids.length} order(s) confirmed`, okCount === ids.length ? "#166534" : "#dc2626");
        load();
      };

      // ── CSV export — loops through every page of the CURRENT filter (not
      // just what's on screen), since an export is normally wanted in full
      // for accounting/reconciliation regardless of pagination. Capped at a
      // generous 50 pages (2,500 orders) so a runaway filter can't hang the
      // browser. ──
      function toCsvCell(v) {
        const s = String(v ?? "");
        return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
      }
      document.getElementById("btnExportCsv").addEventListener("click", async () => {
        const btn = document.getElementById("btnExportCsv");
        const oldText = btn.textContent;
        btn.disabled = true;
        btn.textContent = "Exporting…";
        try {
          const st     = document.getElementById("statusFilter").value;
          const method = document.getElementById("methodFilter").value;
          const q      = document.getElementById("search").value.trim();
          const statusToSend = (st && st !== "payment_pending_all") ? st : null;

          let all = [];
          for (let p = 1; p <= 50; p++) {
            const r = await callFn("admin-orders", { status: statusToSend, q: q || null, page: p, limit });
            const rows = r.data?.orders || [];
            all = all.concat(rows);
            if (rows.length < limit) break;
          }
          if (st === "payment_pending_all") all = all.filter(o => ["payment_link_created", "payment_pending", "created"].includes(o.status));
          if (method) all = all.filter(o => (o.payment_method || "razorpay") === method);

          const cols = ["id", "status", "payment_method", "customer_name", "customer_phone", "customer_email", "total_inr", "coupon_code", "discount_inr", "shiprocket_awb", "created_at"];
          const header = cols.join(",");
          const csvRows = all.map(o => cols.map(c => toCsvCell(o[c])).join(","));
          const csv = [header, ...csvRows].join("\n");
          const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `ahamstree-orders-${new Date().toISOString().slice(0, 10)}.csv`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
        } catch (e) {
          toast("Export failed: " + e.message, "#dc2626");
        } finally {
          btn.disabled = false;
          btn.textContent = oldText;
        }
      });

      load({ reset: true });
    }

    initAdmin();
  </script>
</body>
</html>
