<!doctype html>
<html lang="en-IN">
<head>
  <script src="assets/analytics.js"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Issue Coupon — AhamStree Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css" />

  <style>
    .admin-gate { min-height: 60vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; text-align: center; }
    .pm-card { background: var(--surface); border: 1px solid var(--border-light); padding: 20px; }
    .pm-row { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; margin-top: 12px; }
    .pm-row .full { grid-column: 1 / -1; }
    .pm-label { font-size: 12px; color: var(--text-light); display: block; margin-bottom: 4px; }
    .pm-hint { font-size: 12px; color: var(--text-light); margin-top: 4px; }
    .section-title { font-size: 13px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--text-light); margin: 22px 0 10px; }
    .coupon-code-tag { font-family: monospace; font-weight: 700; font-size: 16px; letter-spacing: .02em; background: var(--bg-warm); padding: 3px 10px; }
    .result-card { border: 1px solid var(--border-light); background: var(--bg-warm); padding: 16px; margin-top: 18px; }
    .pm-list-item { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; padding: 10px 14px; border: 1px solid var(--border-light); background: var(--surface); }
    .pm-list-item + .pm-list-item { margin-top: 8px; }
    .pm-badge { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
    .pm-badge.active { background: rgba(63,107,79,.1); color: #3f6b4f; }
    .pm-badge.neutral { background: var(--border-light); color: var(--text); }
    .pm-badge.warn { background: var(--color-accent-light); color: var(--color-accent); }

    @media (max-width: 640px) {
      .pm-row { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <div id="header"></div>

  <div class="container" style="max-width:860px;">
    <div id="loadingState" style="text-align:center; padding:48px; color:var(--text-light);">Verifying admin access…</div>

    <div id="dashboard" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; margin-bottom:16px;">
        <div>
          <h2 style="margin:0;">Issue Coupon</h2>
          <div class="small" style="color:var(--text-light); margin-top:4px;">Give one customer a unique, single-use discount code — and send it to them on WhatsApp in one click.</div>
        </div>
        <a href="admin.html" class="btn secondary" style="padding:8px 14px; font-size:13px;">← Dashboard</a>
      </div>

      <div class="pm-card">
        <div class="section-title" style="margin-top:0;">Customer</div>
        <div class="pm-row">
          <div>
            <label class="pm-label" for="f_phone">WhatsApp / mobile number</label>
            <input id="f_phone" class="input" type="tel" inputmode="numeric" maxlength="10" placeholder="10-digit mobile" />
          </div>
          <div>
            <label class="pm-label" for="f_name">Customer name (optional)</label>
            <input id="f_name" class="input" placeholder="For a personalized message" />
          </div>
        </div>

        <div class="section-title">Discount</div>
        <div class="pm-row">
          <div>
            <label class="pm-label" for="f_type">Discount type</label>
            <select id="f_type" class="input">
              <option value="percent">Percentage off</option>
              <option value="amount">Flat ₹ off</option>
            </select>
          </div>
          <div>
            <label class="pm-label" id="f_value_label">Percentage off (%)</label>
            <input id="f_value" class="input" type="number" min="0" step="1" placeholder="e.g. 10" />
          </div>
          <div>
            <label class="pm-label" for="f_expires_in_days">Valid for (days)</label>
            <input id="f_expires_in_days" class="input" type="number" min="1" step="1" value="14" />
          </div>
        </div>

        <div class="toggle-row" style="display:flex; align-items:center; gap:8px; margin-top:16px; padding:10px 12px; border:1px solid var(--border-light);">
          <input id="f_send_whatsapp" type="checkbox" checked style="width:16px; height:16px;" />
          <label for="f_send_whatsapp" class="small" style="font-weight:600;">Send via WhatsApp now (only if this number has opted in to marketing)</label>
        </div>

        <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:20px; align-items:center;">
          <button id="btnIssue" class="btn">Issue coupon</button>
          <div id="formStatus" class="small" style="align-self:center;"></div>
        </div>

        <div id="resultCard" class="result-card" style="display:none;"></div>
      </div>

      <div class="section-title">Recently issued</div>
      <div id="recentCount" class="small" style="color:var(--text-light); margin-bottom:10px;"></div>
      <div id="recentList"></div>
    </div>
  </div>

  <div id="footer"></div>

  <script type="module">
    import { renderHeader, renderFooter, hydrateHeaderAuth } from "./assets/ui.js";
    import { supabase, SUPABASE_ANON_KEY } from "./assets/supabase.js";
    import { escapeHtml } from "./assets/safe.js";

    document.getElementById("header").innerHTML = renderHeader("admin");
    document.getElementById("footer").innerHTML = renderFooter();
    hydrateHeaderAuth();

    const BASE = "https://mgmgkwoxirvzdnmayhwq.supabase.co/functions/v1/";
    const ISSUE_FN = BASE + "admin-issue-coupon";
    const COUPONS_FN = BASE + "admin-manage-coupons";

    const loadingState = document.getElementById("loadingState");
    const dashboard    = document.getElementById("dashboard");

    const ICON_WARN = '<svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>';
    const ICON_LOCK = '<svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="1"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';

    function showGateError(icon, title, message) {
      loadingState.style.display = "block";
      dashboard.style.display = "none";
      loadingState.innerHTML =
        '<div class="admin-gate">' +
          '<div style="color:var(--color-accent);">' + icon + '</div>' +
          '<h3 style="margin:0;">' + title + '</h3>' +
          '<div class="small" style="opacity:.8;">' + message + '</div>' +
          '<a class="btn secondary" href="index.html" style="margin-top:8px;">Go to store</a>' +
        '</div>';
    }

    async function authedFetch(url, body) {
      const { data: sess } = await supabase.auth.getSession();
      const token = sess?.session?.access_token || "";
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token, "apikey": SUPABASE_ANON_KEY },
        body: JSON.stringify(body),
      });
      const json = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(json.message || json.error || ("HTTP " + res.status));
      return json;
    }

    function fmtDate(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return "";
      return d.toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });
    }

    function money(v) {
      return "₹" + Number(v || 0).toLocaleString("en-IN", { maximumFractionDigits: 0 });
    }

    document.getElementById("f_type").addEventListener("change", () => {
      const isPercent = document.getElementById("f_type").value === "percent";
      document.getElementById("f_value_label").textContent = isPercent ? "Percentage off (%)" : "Flat amount off (₹)";
    });

    document.getElementById("f_phone").addEventListener("input", (e) => {
      e.target.value = e.target.value.replace(/\D/g, "").slice(0, 10);
    });

    const REASON_TEXT = {
      no_consent: "This number hasn't opted in to WhatsApp marketing — the coupon was created but not sent. Share it yourself if appropriate.",
      template_not_configured: "The WhatsApp coupon template hasn't been approved/configured yet — the coupon was created but not sent. Share it yourself for now.",
      whatsapp_not_configured: "WhatsApp delivery isn't configured — the coupon was created but not sent.",
      send_failed: "WhatsApp delivery failed, so the code was deactivated rather than left unsent. Try again, or share a fresh one manually.",
      manual_share: "Coupon created. Share it with the customer yourself.",
    };

    function renderResult(r) {
      const box = document.getElementById("resultCard");
      box.style.display = "block";
      if (r.sent) {
        box.innerHTML = `
          <div style="font-weight:700; color:#3f6b4f;">✓ Sent on WhatsApp</div>
          <div style="margin-top:8px;">Code: <span class="coupon-code-tag">${escapeHtml(r.coupon_code)}</span></div>
        `;
      } else {
        box.innerHTML = `
          <div style="font-weight:700; color:var(--color-accent);">Coupon created — not sent</div>
          <div style="margin-top:8px;">Code: <span class="coupon-code-tag">${escapeHtml(r.coupon_code)}</span></div>
          <div class="small" style="margin-top:8px; opacity:.85;">${escapeHtml(REASON_TEXT[r.reason] || "Not sent.")}</div>
        `;
      }
    }

    document.getElementById("btnIssue").addEventListener("click", async () => {
      const status = document.getElementById("formStatus");
      const phone = document.getElementById("f_phone").value.trim();
      if (!/^[6-9]\d{9}$/.test(phone)) { status.textContent = "Enter a valid 10-digit Indian mobile number."; return; }
      const value = document.getElementById("f_value").value;
      if (value === "" || Number(value) <= 0) { status.textContent = "Enter a discount value greater than 0."; return; }

      const btn = document.getElementById("btnIssue");
      btn.disabled = true;
      status.textContent = "Issuing…";
      document.getElementById("resultCard").style.display = "none";

      try {
        const r = await authedFetch(ISSUE_FN, {
          phone,
          customer_name: document.getElementById("f_name").value.trim(),
          type: document.getElementById("f_type").value,
          value: Number(value),
          expires_in_days: Number(document.getElementById("f_expires_in_days").value) || 14,
          send_whatsapp: document.getElementById("f_send_whatsapp").checked,
        });
        status.textContent = "";
        renderResult(r);
        loadRecent();
      } catch (e) {
        status.textContent = "Error: " + e.message;
      } finally {
        btn.disabled = false;
      }
    });

    // ── Recently issued ── coupons RLS is service-role only (same as
    // admin-coupons.html), so this goes through the existing coupon-admin
    // edge function rather than a direct client select, filtered down to
    // the ones this page created. ─────────────────────────────────────────
    async function loadRecent() {
      const list = document.getElementById("recentList");
      const count = document.getElementById("recentCount");
      count.textContent = "Loading…";

      let all;
      try {
        const r = await authedFetch(COUPONS_FN, { action: "list" });
        all = (r.coupons || []).filter(c => c.label === "Admin issued");
      } catch (e) {
        count.textContent = "";
        list.innerHTML = `<div class="small">Error loading history: ${escapeHtml(e.message)}</div>`;
        return;
      }

      const data = all.slice(0, 20);
      count.textContent = data.length + " shown";
      if (!data.length) {
        list.innerHTML = '<div class="small" style="color:var(--text-light); padding:12px 0;">None issued yet.</div>';
        return;
      }

      list.innerHTML = data.map(c => {
        const discount = c.type === "percent" ? c.value + "% off" : money(c.value) + " off";
        const expired = c.expires_at && new Date(c.expires_at) <= new Date();
        const used = Number(c.redemption_count || 0) > 0;
        let badge = '<span class="pm-badge active">Active</span>';
        if (used) badge = '<span class="pm-badge neutral">Redeemed</span>';
        else if (expired) badge = '<span class="pm-badge warn">Expired</span>';
        else if (!c.active) badge = '<span class="pm-badge neutral">Deactivated</span>';
        return `
          <div class="pm-list-item">
            <div>
              <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                <span class="coupon-code-tag">${escapeHtml(c.code)}</span>
                <span style="font-weight:700;">${escapeHtml(discount)}</span>
              </div>
              <div class="small" style="color:var(--text-light); margin-top:4px;">${escapeHtml(c.description || "")}</div>
              <div class="small" style="color:var(--text-light); margin-top:4px;">${c.expires_at ? "Expires " + escapeHtml(fmtDate(c.expires_at)) : "No expiry"}</div>
            </div>
            <div>${badge}</div>
          </div>
        `;
      }).join("");
    }

    // ══════════════════════════════════════ INIT ══════════════════════════════════════
    async function initAdmin() {
      try {
        const sessResult = await supabase.auth.getSession();
        if (sessResult.error) return showGateError(ICON_WARN, "Auth Error", sessResult.error.message);
        if (!sessResult.data || !sessResult.data.session) { window.location.href = "login.html"; return; }

        const session = sessResult.data.session;
        const adminResult = await supabase.from("admin_users").select("email").eq("email", session.user.email.toLowerCase()).maybeSingle();
        if (adminResult.error) return showGateError(ICON_WARN, "Access Check Failed", "Could not verify admin status: " + adminResult.error.message);
        if (!adminResult.data) return showGateError(ICON_LOCK, "Access Denied", "Your account does not have admin access.");

        loadingState.style.display = "none";
        dashboard.style.display = "block";

        await loadRecent();
      } catch (e) {
        console.error("Issue coupon admin page error:", e);
        showGateError(ICON_WARN, "Something went wrong", e.message || "An unexpected error occurred.");
      }
    }

    initAdmin();
  </script>
</body>
</html>
